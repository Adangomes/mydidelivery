<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - SNOOP LANCHE</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="container-ativacao" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; display:flex; align-items:center; justify-content:center;">
        <button onclick="ativarSomEDestravar()" style="padding:30px 60px; font-size:24px; background:#ffcc00; color:#000; border:none; border-radius:15px; font-weight:bold; cursor:pointer; box-shadow:0 0 30px rgba(255,204,0,0.4);">
            🔊 CLIQUE PARA LIGAR O SOM
        </button>
    </div>

    <header class="admin-header">
        <h1>Painel <span>SNOOP LANCHE</span></h1>
        <button class="btn-relatorio" onclick="abrirRelatorio()">📊 Ver Relatório</button>
    </header>

    <ul id="pedidos-container"></ul>

    <div id="modal-relatorio" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharRelatorio()">&times;</span>
            <h2 class="modal-title">HISTÓRICO DE VENDAS</h2>
            <div class="stats-container">
                <div class="stat-box">PEDIDOS<br><b id="rel-qtd">0</b></div>
                <div class="stat-box">TOTAL VENDIDO<br><b id="rel-total">R$ 0,00</b></div>
            </div>
            <div class="table-wrapper">
                <table class="table-rel">
                    <thead><tr><th>Hora</th><th>Cliente</th><th>Valor</th></tr></thead>
                    <tbody id="tabela-relatorio"></tbody>
                </table>
            </div>
            <button class="btn-limpar" onclick="limparRelatorio()">🗑️ LIMPAR HISTÓRICO</button>
        </div>
    </div>

    <iframe id="iframe-impressao"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let prontoParaTocar = false;
        let audioLiberado = false;

        // FUNÇÃO QUE ATIVA O SOM USANDO 'alert.mpeg'
        function ativarSomEDestravar() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            if (context.state === 'suspended') context.resume();

            const somTeste = new Audio('alert.mpeg');
            somTeste.play().then(() => {
                audioLiberado = true;
                prontoParaTocar = true;
                document.getElementById('container-ativacao').style.display = 'none';
                console.log("Som 'alert.mpeg' carregado com sucesso!");
            }).catch(e => {
                console.error(e);
                alert("ERRO: Não achei o arquivo 'alert.mpeg'. Verifique se ele subiu para o Netlify com esse nome exato.");
            });
        }

        // ESCUTA NOVOS PEDIDOS
        db.ref('pedidos').on('child_added', (snap) => {
            const p = snap.val();
            const id = snap.key;
            const li = document.createElement('li');
            li.className = 'pedido-card';
            li.id = `card-${id}`;
            
            let itensHtml = Array.isArray(p.itens) ? p.itens.map(i => `• ${i.qtd}x ${i.produto}`).join('<br>') : "Erro nos itens";

            li.innerHTML = `
                <h3>${p.cliente} <span class="badge-pagamento">${p.pagamento || 'NÃO INFORMADO'}</span></h3>
                <div class="info"><b>📍 Endereço:</b> ${p.endereco}</div>
                <div class="itens-box">${itensHtml}</div>
                <div class="info-obs"><b>💬 Obs:</b> ${p.observacao || 'Nenhuma'}</div>
                <div class="total">R$ ${parseFloat(p.total || 0).toFixed(2).replace('.',',')}</div>
                <div class="btn-group">
                    <button class="btn-cozinha" onclick="imprimir('cozinha', '${id}')">Cozinha</button>
                    <button class="btn-motoboy" onclick="imprimir('motoboy', '${id}')">Motoboy</button>
                </div>
                <button class="btn-concluir" onclick="concluirPedido('${id}')">✅ Concluir Pedido</button>
            `;
            document.getElementById('pedidos-container').prepend(li);

            // TOCA O SOM 'alert.mpeg'
            if (prontoParaTocar && audioLiberado) {
                const notificacao = new Audio('alert.mpeg');
                notificacao.play().catch(e => console.log("Erro ao tocar som de novo pedido."));
            }
        });

        // Carregamento inicial
        db.ref('pedidos').once('value', () => { 
            setTimeout(() => { if(audioLiberado) prontoParaTocar = true; }, 2000); 
        });

        // FUNÇÕES DE IMPRESSÃO E RELATÓRIO
        function imprimir(tipo, id) {
            db.ref('pedidos/'+id).once('value', s => {
                const p = s.val();
                let itens = Array.isArray(p.itens) ? p.itens.map(i => `${i.qtd}x ${i.produto}`).join('<br>') : "Sem itens";
                let html = tipo === 'cozinha' ? 
                    `<div style="width:72mm;font-family:Arial;text-align:center;"><h2>COZINHA</h2><hr><div style="text-align:left;"><b>CLIENTE:</b> ${p.cliente}<br><hr><b>ITENS:</b><br>${itens}<br><hr><b>OBS:</b> ${p.observacao}</div></div>` :
                    `<div style="width:72mm;font-family:Arial;"><center><h2>ENTREGA</h2></center><hr><b>CLIENTE:</b> ${p.cliente}<br><b>ENDEREÇO:</b> ${p.endereco}<br><hr><b>PAGAMENTO:</b> ${p.pagamento}<br><b>VALOR: R$ ${parseFloat(p.total).toFixed(2)}</b><br><hr><b>OBS:</b> ${p.observacao}</div>`;
                const doc = document.getElementById('iframe-impressao').contentWindow.document;
                doc.open(); doc.write(`<html><body style="margin:0;" onload="window.print()">${html}</body></html>`); doc.close();
            });
        }

        function concluirPedido(id) {
            if(confirm("Concluir pedido?")){
                const ref = db.ref('pedidos/'+id);
                ref.once('value', s => {
                    const data = s.val();
                    data.horaFinalizado = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    db.ref('relatorios').child(id).set(data).then(() => {
                        ref.remove();
                        document.getElementById('card-'+id).remove();
                    });
                });
            }
        }

        function abrirRelatorio() {
            const lista = document.getElementById('tabela-relatorio');
            lista.innerHTML = ''; let total = 0; let qtd = 0;
            db.ref('relatorios').once('value', s => {
                s.forEach(c => {
                    const r = c.val(); total += parseFloat(r.total || 0); qtd++;
                    lista.innerHTML += `<tr><td>${r.horaFinalizado || '--:--'}</td><td>${r.cliente}</td><td>R$ ${parseFloat(r.total).toFixed(2)}</td></tr>`;
                });
                document.getElementById('rel-total').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
                document.getElementById('rel-qtd').innerText = qtd;
                document.getElementById('modal-relatorio').style.display = 'block';
            });
        }
        function fecharRelatorio() { document.getElementById('modal-relatorio').style.display = 'none'; }
        function limparRelatorio() { if(confirm("Limpar todo o histórico?")) db.ref('relatorios').remove().then(() => abrirRelatorio()); }
    </script>
</body>
</html>
