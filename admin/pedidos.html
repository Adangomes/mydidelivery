<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOOP LANCHE - Admin</title>
    <link rel="stylesheet" href="admin.css"> 
</head>
<body>
    <!-- 🔐 LOGIN ADMIN -->
<div id="login-admin" style="
    position:fixed;
    inset:0;
    background:#000;
    z-index:30000;
    display:flex;
    align-items:center;
    justify-content:center;
">
    <div style="background:#111; padding:40px; border-radius:20px; text-align:center; width:320px;">
        <h2 style="color:#ffcc00;">SNOOP ADMIN</h2>
        <input 
            type="password" 
            id="senhaAdmin" 
            placeholder="Digite a senha"
            style="width:100%; padding:15px; font-size:18px; border-radius:10px; border:none; margin:20px 0;"
        >
        <button onclick="verificarSenha()" style="
            width:100%;
            padding:15px;
            font-size:18px;
            background:#ffcc00;
            border:none;
            border-radius:10px;
            font-weight:bold;
            cursor:pointer;
        ">
            ENTRAR
        </button>
        <p id="erro-senha" style="color:red; display:none;">Senha incorreta</p>
    </div>
</div>

    <div id="container-ativacao" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; display:flex; align-items:center; justify-content:center;">
        <button onclick="ativarSomEDestravar()" style="padding:30px 60px; font-size:24px; background:#ffcc00; color:#000; border:none; border-radius:15px; font-weight:bold; cursor:pointer;">
            🔊 ATIVAR SOM DO SISTEMA
        </button>
    </div>

    <header class="admin-header">
        <h1>SNOOP <span>LANCHE</span></h1>
        <button class="btn-relatorio" onclick="abrirRelatorio()"> HISTÓRICO</button>
    </header>

    <ul id="pedidos-container"></ul>

    <div id="modal-relatorio" class="modal">
        <div class="modal-content">
            <span style="float:right; cursor:pointer; font-size:28px; color:white;" onclick="fecharRelatorio()">&times;</span>
            <h2 style="text-align:center; color:var(--primary);">HISTÓRICO DE VENDAS</h2>
            <div class="stats-container">
                <div class="stat-box">PEDIDOS<br><b id="rel-qtd">0</b></div>
                <div class="stat-box">TOTAL VENDIDO<br><b id="rel-total">R$ 0,00</b></div>
            </div>
            <div class="table-wrapper">
                <table class="table-rel">
                    <thead><tr><th>Hora</th><th>Cliente</th><th>Valor</th></tr></thead>
                    <tbody id="tabela-relatorio"></tbody>
                </table>
            </div>
            <button class="btn-limpar" onclick="limparRelatorio()">🗑️ LIMPAR HISTÓRICO</button>
        </div>
    </div>

    <iframe id="iframe-impressao"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 2. IDENTIFICAÇÃO AUTOMÁTICA DA LOJA
        // ==========================================
        const host = window.location.hostname;
        let LOJA_ID = "snoop_lanche"; // Padrão

        // Se o domínio contiver "casadacerveja", muda a "chave" do banco de dados
        if (host.includes("casadacerveja")) {
            LOJA_ID = "casa_da_cerveja";
        }

        // Ajusta os nomes na tela assim que carregar
        document.addEventListener("DOMContentLoaded", () => {
            const titulo = document.querySelector(".admin-header h1");
            const loginTitulo = document.querySelector("#login-admin h2");
            
            if (LOJA_ID === "casa_da_cerveja") {
                if(titulo) titulo.innerHTML = "CASA DA <span>CERVEJA</span>";
                if(loginTitulo) loginTitulo.innerText = "CASA DA CERVEJA ADMIN";
                document.title = "CASA DA CERVEJA - Admin";
            }
        });

        // ==========================================
        // 3. CONFIGURAÇÃO FIREBASE (SUA CONTA)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 🔐 LOGIN ADMIN (AJUSTADO PARA DUAS SENHAS)
        // ==========================================
        const SENHAS = {
            "snoop_lanche": "snoop2026",      // Senha do Snoop
            "casa_da_cerveja": "cerveja2026"   // Senha da Casa da Cerveja
        };

        function verificarSenha() {
            const senhaDigitada = document.getElementById("senhaAdmin").value;
            const senhaCorreta = SENHAS[LOJA_ID]; // Pega a senha baseada na loja detectada no topo

            if (senhaDigitada === senhaCorreta) {
                document.getElementById("login-admin").style.display = "none";
                // Salva o login específico desta loja para não deslogar a outra
                localStorage.setItem("admin_logado_" + LOJA_ID, "true");
            } else {
                document.getElementById("erro-senha").style.display = "block";
            }
        }

        // Verifica se o admin já está logado nesta loja específica
        if (localStorage.getItem("admin_logado_" + LOJA_ID) === "true") {
            document.getElementById("login-admin").style.display = "none";
        }

        // ==========================================
        // 4. CONTROLE DE SOM E RECEBIMENTO
        // ==========================================
        let prontoParaTocar = false;

        function ativarSomEDestravar() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            if (context.state === 'suspended') context.resume();
            new Audio('alert.mpeg').play().then(() => {
                prontoParaTocar = true;
                document.getElementById('container-ativacao').style.display = 'none';
            }).catch(() => alert("Erro: certifique-se que o arquivo 'alert.mpeg' existe."));
        }

        // 🚀 ESCUTA APENAS A PASTA DA LOJA ATUAL
        db.ref('pedidos/' + LOJA_ID).on('child_added', (snap) => {
            const p = snap.val();
            const id = snap.key;
            const li = document.createElement('li');
            li.className = 'pedido-card';
            li.id = `card-${id}`;
            
            let itensHtml = Array.isArray(p.itens) ? p.itens.map(i => 
                `• ${i.qtd}x ${i.produto} <small style="color:#888;">(R$ ${parseFloat(i.precoUn || 0).toFixed(2)})</small>`
            ).join('<br>') : "Erro nos itens";

            li.innerHTML = `
                <h3>${p.cliente} <span class="badge-pagamento">${p.pagamento}</span></h3>
                <div class="info"><b> Horário:</b> ${p.horario}</div>
                <div class="info"><b> Endereço:</b> ${p.endereco}</div>
                <div class="info"><b> Ref:</b> ${p.referencia || 'Não informada'}</div>
                <div class="itens-box">
                    <b style="color:var(--primary);"> ITENS DO PEDIDO:</b><br>
                    <div style="margin-top:5px;">${itensHtml}</div>
                </div>
                <div class="info-obs">💬 OBS: ${p.obs_cozinha || 'Nenhuma'}</div>
                <div class="financeiro-box">
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <span>Produtos: R$ ${parseFloat(p.subtotal || 0).toFixed(2)}</span>
                        <span>Taxa: R$ ${parseFloat(p.taxaEntrega || 0).toFixed(2)}</span>
                    </div>
                    ${p.desconto > 0 ? `<div style="color: #d35400; font-weight: bold;">Cupom: - R$ ${parseFloat(p.desconto).toFixed(2)}</div>` : ''}
                    <div class="total">TOTAL: R$ ${parseFloat(p.total).toFixed(2)}</div>
                </div>
                <div class="btn-group">
                    <button class="btn-cozinha" onclick="imprimir('cozinha', '${id}')">COZINHA</button>
                    <button class="btn-motoboy" onclick="imprimir('motoboy', '${id}')">MOTOBOY</button>
                </div>
                <button class="btn-concluir" onclick="concluirPedido('${id}')">✅ CONCLUIR PEDIDO</button>
            `;

            document.getElementById('pedidos-container').prepend(li);
            if (prontoParaTocar) new Audio('alert.mpeg').play().catch(()=>{});
        });

        // ==========================================
        // 5. IMPRESSÃO, CONCLUSÃO E RELATÓRIOS
        // ==========================================
        function imprimir(tipo, id) {
            db.ref(`pedidos/${LOJA_ID}/${id}`).once('value', s => {
                const p = s.val();
                let lista = Array.isArray(p.itens) ? p.itens.map(i => `${i.qtd}x ${i.produto}`).join('<br>') : "";
                let nomeLoja = LOJA_ID === "casa_da_cerveja" ? "CASA DA CERVEJA" : "SNOOP LANCHE";
                
                let html = `<div style="width:72mm;font-family:Arial;text-align:center;">
                                <h2>${nomeLoja}</h2>
                                <h3>${tipo.toUpperCase()} (${p.horario})</h3><hr>
                                <div style="text-align:left;">
                                    <b>CLIENTE:</b> ${p.cliente}<br>
                                    ${tipo === 'motoboy' ? `<b>ENDEREÇO:</b> ${p.endereco}<br><b>PAGAMENTO:</b> ${p.pagamento}<br>` : ''}
                                    <hr><b>ITENS:</b><br>
                                    <div style="font-size:16px;font-weight:bold;">${lista}</div><hr>
                                    <b>TOTAL: R$ ${parseFloat(p.total).toFixed(2)}</b><br>
                                    <b>OBS:</b> ${p.obs_cozinha || 'Nenhuma'}
                                </div>
                            </div>`;
                
                const win = document.getElementById('iframe-impressao').contentWindow;
                win.document.open(); 
                win.document.write(`<html><body style="margin:0;" onload="window.print()">${html}</body></html>`); 
                win.document.close();
            });
        }

        function concluirPedido(id) {
            if(confirm("Deseja concluir este pedido?")){
                const refOrigem = db.ref(`pedidos/${LOJA_ID}/${id}`);
                refOrigem.once('value', s => {
                    db.ref(`relatorios/${LOJA_ID}/${id}`).set(s.val()).then(() => {
                        refOrigem.remove();
                        document.getElementById('card-'+id).remove();
                    });
                });
            }
        }

        function abrirRelatorio() {
            const t = document.getElementById('tabela-relatorio'); t.innerHTML = '';
            let soma = 0; let q = 0;
            db.ref(`relatorios/${LOJA_ID}`).once('value', s => {
                s.forEach(c => {
                    const r = c.val(); soma += parseFloat(r.total); q++;
                    t.innerHTML += `<tr><td>${r.horario}</td><td>${r.cliente}</td><td>R$ ${parseFloat(r.total).toFixed(2)}</td></tr>`;
                });
                document.getElementById('rel-total').innerText = 'R$ ' + soma.toFixed(2);
                document.getElementById('rel-qtd').innerText = q;
                document.getElementById('modal-relatorio').style.display = 'block';
            });
        }

        function fecharRelatorio() { document.getElementById('modal-relatorio').style.display = 'none'; }
        
        function limparRelatorio() { 
            if(confirm("Limpar todo o histórico desta loja?")) {
                db.ref(`relatorios/${LOJA_ID}`).remove().then(() => abrirRelatorio()); 
            }
        }

        const statusRef = db.ref(`configuracoes/${LOJA_ID}/status`);
        function alternarStatusLoja() {
            statusRef.once('value', (snap) => {
                const statusAtual = snap.val();
                statusRef.set(!statusAtual);
            });
        }    
    </script>
