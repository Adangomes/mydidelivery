<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MYDI DELIVERY</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="painel-pedidos">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Novos Pedidos - MYDI DELIVERY</h2>
            <button onclick="abrirRelatorio()" class="btn-abrir-relatorio">📊 Ver Relatório</button>
        </div>
        <ul id="pedidos-container"></ul>
    </div>

    <div id="modal-relatorio" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);">
        <div class="modal-content" style="background: #1a1a1a; margin: 2% auto; padding: 25px; width: 90%; max-width: 600px; border-radius: 12px; color: white; border: 1px solid #333;">
            <span class="fechar-modal" onclick="fecharRelatorio()" style="float: right; cursor: pointer; font-size: 30px; color: #ffcc00;">&times;</span>
            <h2 style="color: #ffcc00; text-align: center; margin-bottom: 20px;">RELATÓRIO DE VENDAS</h2>
            
            <div class="resumo-caixa" style="display: flex; justify-content: space-around; background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #444;">
                <div style="text-align: center;">PEDIDOS<br><span id="rel-qtd" style="color: #ffcc00; font-size: 24px; font-weight: bold;">0</span></div>
                <div style="text-align: center;">TOTAL ACUMULADO<br><span id="rel-total" style="color: #27ae60; font-size: 24px; font-weight: bold;">R$ 0,00</span></div>
            </div>

            <div style="max-height: 350px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead style="position: sticky; top: 0; background: #1a1a1a;">
                        <tr style="border-bottom: 2px solid #ffcc00;">
                            <th style="text-align: left; padding: 10px;">Hora</th>
                            <th style="text-align: left; padding: 10px;">Cliente</th>
                            <th style="text-align: right; padding: 10px;">Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-relatorio"></tbody>
                </table>
            </div>

            <button onclick="limparRelatorio()" class="btn-limpar-relatorio">🗑️ LIMPAR RELATÓRIO COMPLETAMENTE</button>
        </div>
    </div>

    <iframe id="iframe-impressao" style="display:none;"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let paginaCarregada = false;

        // 1. ESCUTA NOVOS PEDIDOS
        db.ref('pedidos').on('child_added', (snapshot) => {
            const pedido = snapshot.val();
            const container = document.getElementById('pedidos-container');
            const idPedido = snapshot.key;
            
            let itensHtml = Array.isArray(pedido.itens) 
                ? pedido.itens.map(i => `<div>${i.qtd}x ${i.produto}</div>`).join('')
                : pedido.itens;
            
            const li = document.createElement('li');
            li.className = 'pedido-card';
            li.id = `card-${idPedido}`;
            li.innerHTML = `
                <h3>${pedido.cliente} <span>${new Date().toLocaleTimeString('pt-BR')}</span></h3>
                <div class="info-entrega"><strong>Endereço:</strong> ${pedido.endereco}</div>
                <div class="itens-lista"><strong>Itens:</strong><br>${itensHtml}</div>
                <div class="obs-alerta">OBS: ${pedido.observacao || 'Nenhuma'}</div>
                <div class="total-container">TOTAL: R$ ${(pedido.total || 0).toFixed(2).replace('.', ',')}</div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn-imprimir" style="flex: 1; margin: 0;" id="btn-print-${idPedido}">🖨️ Imprimir</button>
                    <button onclick="concluirPedido('${idPedido}')" style="flex: 1; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">✅ Concluir</button>
                </div>
            `;

            container.prepend(li);
            
            // SOM CHAMATIVO (Telefone Antigo)
            if (paginaCarregada) {
                // Som de campainha de telefone/orelhão
                const somAlerta = new Audio('https://www.soundjay.com/phone/sounds/phone-calling-1.mp3');
                somAlerta.play().catch(e => console.log("Clique na página para ativar o som."));
            }

            // Ação de Impressão Manual
            const layoutCupom = `
                <div style="font-family: monospace; width: 72mm; padding: 5px;">
                    <center><h2>MYDI DELIVERY</h2></center>
                    <hr>
                    <b>CLIENTE:</b> ${pedido.cliente}<br>
                    <b>ENDEREÇO:</b> ${pedido.endereco}<br>
                    <hr>
                    <b>ITENS:</b><br>${itensHtml}
                    <hr>
                    <b>TOTAL: R$ ${(pedido.total || 0).toFixed(2).replace('.', ',')}</b>
                </div>
            `;
            li.querySelector(`#btn-print-${idPedido}`).onclick = () => enviarParaImpressora(layoutCupom);
        });

        // Marca que a carga inicial terminou para não tocar som em pedidos velhos
        db.ref('pedidos').once('value', () => {
            setTimeout(() => { paginaCarregada = true; }, 2000);
        });

        // 2. FUNÇÃO CONCLUIR
        function concluirPedido(id) {
            if (confirm("Concluir este pedido? Ele irá para o relatório.")) {
                const refPedido = db.ref('pedidos/' + id);
                refPedido.once('value').then((snapshot) => {
                    const dados = snapshot.val();
                    dados.horaConcluido = new Date().toLocaleTimeString('pt-BR');
                    
                    db.ref('relatorios').child(id).set(dados).then(() => {
                        refPedido.remove();
                        const card = document.getElementById(`card-${id}`);
                        if (card) card.remove();
                    });
                });
            }
        }

        // 3. FUNÇÕES DO RELATÓRIO
        function abrirRelatorio() {
            const tabela = document.getElementById('tabela-relatorio');
            const totalTexto = document.getElementById('rel-total');
            const qtdTexto = document.getElementById('rel-qtd');
            tabela.innerHTML = ''; 
            
            let somaTotal = 0;
            let contador = 0;

            db.ref('relatorios').once('value', (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const p = childSnapshot.val();
                    somaTotal += parseFloat(p.total || 0);
                    contador++;

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = "1px solid #333";
                    tr.innerHTML = `
                        <td style="padding: 10px;">${p.horaConcluido || '---'}</td>
                        <td style="padding: 10px;">${p.cliente}</td>
                        <td style="padding: 10px; text-align: right; color: #27ae60; font-weight: bold;">R$ ${parseFloat(p.total).toFixed(2).replace('.',',')}</td>
                    `;
                    tabela.appendChild(tr);
                });
                totalTexto.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
                qtdTexto.innerText = contador;
            });
            document.getElementById('modal-relatorio').style.display = "block";
        }

        function fecharRelatorio() {
            document.getElementById('modal-relatorio').style.display = "none";
        }

        function limparRelatorio() {
            if (confirm("Deseja APAGAR TODO o histórico de vendas? Esta ação não pode ser desfeita.")) {
                db.ref('relatorios').remove().then(() => {
                    alert("Relatório limpo!");
                    abrirRelatorio();
                });
            }
        }

        function enviarParaImpressora(htmlCupom) {
            const iframe = document.getElementById('iframe-impressao');
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`<html><body onload="window.print()">${htmlCupom}</body></html>`);
            doc.close();
        }
    </script>
</body>
</html>
