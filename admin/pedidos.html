<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Snoop Lanche - Gestão</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div id="container-ativacao">
        <button onclick="ativarSom()">🔊 ATIVAR SOM E INICIAR PAINEL</button>
    </div>

    <header class="admin-header">
        <h1>SNOOP <span>LANCHE</span></h1>
        <button class="btn-relatorio" onclick="abrirRelatorio()">📊 HISTÓRICO</button>
    </header>

    <ul id="pedidos-container"></ul>

    <iframe id="iframe-impressao" style="display:none;"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function ativarSom() {
            document.getElementById('container-ativacao').style.display = 'none';
        }

        // --- FUNÇÃO DE IMPRESSÃO ---
        function imprimirPedido(id) {
            db.ref('pedidos/' + id).once('value', (snapshot) => {
                const p = snapshot.val();
                if (!p) return;

                const itensHtml = p.itens.map(i => `
                    <tr>
                        <td style="width:30px">${i.qtd}x</td>
                        <td>${i.produto}</td>
                    </tr>
                `).join('');

                const cupom = `
                    <html>
                    <body style="font-family: 'Courier New', monospace; width: 80mm; padding: 10px;">
                        <center>
                            <h2 style="margin:0">SNOOP LANCHE</h2>
                            <p>--------------------------------</p>
                            <h3 style="margin:5px 0">CUPOM DE COZINHA</h3>
                            <p>${p.horario}</p>
                        </center>
                        <p><strong>CLIENTE:</strong> ${p.cliente}</p>
                        <p>--------------------------------</p>
                        <table style="width:100%; border-collapse: collapse;">
                            ${itensHtml}
                        </table>
                        <p>--------------------------------</p>
                        <p><strong>OBS:</strong> ${p.obs_cozinha || 'Nenhuma'}</p>
                        <p><strong>ENDEREÇO:</strong> ${p.endereco}</p>
                        <center><p>--------------------------------</p></center>
                    </body>
                    </html>
                `;

                const win = document.getElementById('iframe-impressao').contentWindow;
                win.document.open();
                win.document.write(cupom);
                win.document.close();
                setTimeout(() => {
                    win.print();
                }, 500);
            });
        }

        // --- GESTÃO DE STATUS ---
        db.ref('pedidos').on('value', (snapshot) => {
                    const container = document.getElementById('pedidos-container');
                    container.innerHTML = "";
                    snapshot.forEach(child => {
                                const p = child.val();
                                const id = child.key;
                                const status = p.status || 'pendente';

                                const li = document.createElement('li');
                                li.className = `pedido-card status-${status}`;

                                let botoes = "";
                                if (status === 'pendente') {
                                    botoes = `
                        <button class="btn-success" onclick="db.ref('pedidos/${id}').update({status:'preparando'})">ACEITAR</button>
                        <button class="btn-danger" onclick="db.ref('pedidos/${id}').remove()">RECUSAR</button>`;
                                } else if (status === 'preparando') {
                                    botoes = `
                        <button class="btn-warning" onclick="imprimirPedido('${id}')">COZINHA</button>
                        <button class="btn-info" onclick="db.ref('pedidos/${id}').update({status:'entrega'})"> SAIR PARA ENTREGA</button>`;
                                } else if (status === 'entrega') {
                                    botoes = `<button class="btn-success" onclick="concluirPedido('${id}')"> CONCLUIR</button>`;
                                }

                                li.innerHTML = `
                    <div class="status-tag">${status.toUpperCase()}</div>
                    <h3>${p.cliente}</h3>
                    <p class="info"> ${p.endereco}</p>
                    <div class="itens-box">${p.itens.map(i => `• ${i.produto}<br>`).join('')}</div>
                    <p class="obs"> ${p.obs_cozinha || 'Sem observações'}</p>
                    <div class="total">R$ ${parseFloat(p.total).toFixed(2)}</div>
                    <div class="btn-actions">${botoes}</div>
                `;
                container.appendChild(li);
            });
        });

        function concluirPedido(id) {
            db.ref('pedidos/' + id).once('value', s => {
                db.ref('relatorios').push(s.val()).then(() => db.ref('pedidos/' + id).remove());
            });
        }
    </script>
</body>

</html>
