<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Snoop Lanche - Gestão</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="container-ativacao">
        <div style="text-align: center;">
            <h2 style="color: #ffcc00; margin-bottom: 20px; font-family: sans-serif;">SNOOP LANCHE SISTEMA</h2>
            <button onclick="ativarSom()">🔊 CLIQUE PARA INICIAR E ATIVAR SOM</button>
            <button onclick="testarAudioDireto()" style="margin-top: 20px; background: #555; color: #fff; font-size: 0.8rem; padding: 10px;">TESTAR ARQUIVO DE SOM</button>
        </div>
    </div>

    <header class="admin-header">
        <h1>SNOOP <span>LANCHE</span></h1>
        <button class="btn-refresh" onclick="location.reload()">🔄</button>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="mudarAba('pendente', this)">NOVOS</button>
        <button class="tab-btn" onclick="mudarAba('preparando', this)">COZINHA</button>
        <button class="tab-btn" onclick="mudarAba('entrega', this)">ENTREGA</button>
        <button class="tab-btn btn-hist" onclick="mudarAba('historico', this)">📊 HISTÓRICO</button>
    </nav>

    <ul id="pedidos-container"></ul>
    <iframe id="iframe-impressao" style="display:none;"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Tenta usar o seu arquivo, se falhar usa o link da web
        let audioAlerta = new Audio('alert.mpeg');
        audioAlerta.loop = true;

        function testarAudioDireto() {
            alert("Vou tentar tocar o som agora para testar...");
            audioAlerta.play().catch(e => {
                alert("Erro: " + e.message + " - Vou tentar o som de backup!");
                audioAlerta.src = "https://raw.githubusercontent.com/rafaelbotazini/admin-painel/main/alert.mp3";
                audioAlerta.play();
            });
        }

        function ativarSom() {
            document.getElementById('container-ativacao').style.display = 'none';
            audioAlerta.play().then(() => {
                audioAlerta.pause();
                audioAlerta.currentTime = 0;
            }).catch(e => console.log("Erro ao iniciar áudio:", e));
        }

        let abaAtiva = 'pendente';

        function carregarDados() {
            db.ref('pedidos').on('value', (snapshot) => {
                const container = document.getElementById('pedidos-container');
                container.innerHTML = "";
                let temPendente = false;

                snapshot.forEach(child => {
                    const p = child.val();
                    if (p.status === 'pendente' || !p.status) temPendente = true;
                    
                    if (abaAtiva !== 'historico' && (p.status || 'pendente') === abaAtiva) {
                        const li = document.createElement('li');
                        li.className = `pedido-card`;
                        li.innerHTML = `
                            <div class="card-header"><span class="cliente-nome">${p.cliente}</span></div>
                            <div class="total-area">TOTAL: R$ ${parseFloat(p.total).toFixed(2)}</div>
                            <button class="btn-success" onclick="db.ref('pedidos/${child.key}').update({status:'preparando'})">ACEITAR</button>
                        `;
                        container.appendChild(li);
                    }
                });

                // LÓGICA DE DISPARO
                if (temPendente && abaAtiva === 'pendente') {
                    console.log("ALERTA: Pedido novo detectado!");
                    audioAlerta.play().catch(e => console.log("Navegador bloqueou som:", e));
                } else {
                    audioAlerta.pause();
                    audioAlerta.currentTime = 0;
                }
            });
        }

        function mudarAba(aba, btn) {
            abaAtiva = aba;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            carregarDados();
        }

        carregarDados();
    </script>
</body>
</html>
