<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MYDI DELIVERY</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="painel-pedidos">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Novos Pedidos - MYDI DELIVERY</h2>
            <button onclick="abrirRelatorio()" class="btn-abrir-relatorio">📊 Ver Relatório</button>
        </div>
        <ul id="pedidos-container"></ul>
    </div>

    <div id="modal-relatorio">
        <div class="modal-content">
            <span class="fechar-modal" onclick="fecharRelatorio()">&times;</span>
            <h2 style="color: #ffcc00; text-align: center;">RELATÓRIO DE VENDAS</h2>
            
            <div class="resumo-caixa">
                <div>PEDIDOS: <span id="rel-qtd" style="color: #ffcc00; font-weight: bold;">0</span></div>
                <div>TOTAL: <span id="rel-total" style="color: #27ae60; font-weight: bold;">R$ 0,00</span></div>
            </div>

            <table class="tab-relatorio">
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Cliente</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="tabela-relatorio">
                    </tbody>
            </table>
        </div>
    </div>

    <iframe id="iframe-impressao" style="display:none;"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. ESCUTA NOVOS PEDIDOS
        db.ref('pedidos').on('child_added', (snapshot) => {
            const pedido = snapshot.val();
            const container = document.getElementById('pedidos-container');
            const idPedido = snapshot.key;
            
            let itensHtml = Array.isArray(pedido.itens) 
                ? pedido.itens.map(i => `<div>${i.qtd}x ${i.produto}</div>`).join('')
                : pedido.itens;
            
            const li = document.createElement('li');
            li.className = 'pedido-card';
            li.id = `card-${idPedido}`;
            li.innerHTML = `
                <h3>${pedido.cliente} <span>${new Date().toLocaleTimeString('pt-BR')}</span></h3>
                <div class="info-entrega"><strong>Endereço:</strong> ${pedido.endereco}</div>
                <div class="itens-lista"><strong>Itens:</strong><br>${itensHtml}</div>
                <div class="obs-alerta">OBS: ${pedido.observacao || 'Nenhuma'}</div>
                <div class="total-container">TOTAL: R$ ${(pedido.total || 0).toFixed(2).replace('.', ',')}</div>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn-imprimir" style="flex: 1; margin: 0;" id="btn-print-${idPedido}">🖨️ Reimprimir</button>
                    <button onclick="concluirPedido('${idPedido}')" style="flex: 1; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">✅ Concluir</button>
                </div>
            `;

            // Layout do Cupom Elgin
            const cupomParaImpressora = `
                <div style="font-family: Arial, sans-serif; width: 72mm; color: black; padding: 5px;">
                    <div style="text-align: center;">
                        <h2 style="margin: 0; font-size: 1.5em;">MYDI DELIVERY</h2>
                        <p style="margin: 5px 0;">PEDIDO #${idPedido.slice(-4)}</p>
                    </div>
                    <div style="border-top: 1px dashed black; margin: 10px 0;"></div>
                    <strong>CLIENTE:</strong> ${pedido.cliente}<br>
                    <strong>ENDEREÇO:</strong> ${pedido.endereco}
                    <div style="border-top: 1px dashed black; margin: 10px 0;"></div>
                    <strong>ITENS:</strong><br>${itensHtml}
                    <div style="border-top: 1px dashed black; margin: 10px 0;"></div>
                    <strong>TOTAL: R$ ${(pedido.total || 0).toFixed(2).replace('.', ',')}</strong>
                    <div style="text-align: center; margin-top: 15px; font-size: 0.8em;">${new Date().toLocaleString('pt-BR')}</div>
                </div>
            `;

            container.prepend(li);
            
            // Som de alerta
            const toqueTelefone = new Audio('https://www.soundjay.com/phone/phone-calling-1.mp3');
            toqueTelefone.play().catch(() => {});

            // Ações dos botões
            li.querySelector(`#btn-print-${idPedido}`).onclick = () => enviarParaImpressora(cupomParaImpressora);

            // Impressão Automática
            enviarParaImpressora(cupomParaImpressora);
        });

        // 2. FUNÇÃO CONCLUIR E MOVER PARA RELATÓRIO
        function concluirPedido(id) {
            if (confirm("Deseja finalizar este pedido e enviar para o relatório?")) {
                const refPedido = db.ref('pedidos/' + id);
                refPedido.once('value').then((snapshot) => {
                    const dados = snapshot.val();
                    dados.horaConcluido = new Date().toLocaleTimeString('pt-BR');
                    
                    // Salva em 'relatorios' e remove de 'pedidos'
                    db.ref('relatorios').child(id).set(dados).then(() => {
                        refPedido.remove().then(() => {
                            const card = document.getElementById(`card-${id}`);
                            if (card) card.remove();
                        });
                    });
                });
            }
        }

        // 3. FUNÇÕES DO MODAL DE RELATÓRIO
        function abrirRelatorio() {
            const tabela = document.getElementById('tabela-relatorio');
            const totalTexto = document.getElementById('rel-total');
            const qtdTexto = document.getElementById('rel-qtd');
            tabela.innerHTML = ''; 
            
            let somaTotal = 0;
            let contador = 0;

            db.ref('relatorios').once('value', (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const p = childSnapshot.val();
                    somaTotal += parseFloat(p.total || 0);
                    contador++;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.horaConcluido || '---'}</td>
                        <td>${p.cliente}</td>
                        <td style="color: #27ae60; font-weight: bold;">R$ ${parseFloat(p.total).toFixed(2).replace('.',',')}</td>
                    `;
                    tabela.prepend(tr);
                });
                totalTexto.innerText = `R$ ${somaTotal.toFixed(2).replace('.', ',')}`;
                qtdTexto.innerText = contador;
            });
            document.getElementById('modal-relatorio').style.display = "block";
        }

        function fecharRelatorio() {
            document.getElementById('modal-relatorio').style.display = "none";
        }

        function enviarParaImpressora(htmlCupom) {
            const iframe = document.getElementById('iframe-impressao');
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`<html><body style="margin:0;" onload="window.print()">${htmlCupom}</body></html>`);
            doc.close();
        }
    </script>
</body>
</html>
