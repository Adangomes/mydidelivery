<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Snoop Lanche - Gestão</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="container-ativacao">
        <button onclick="ativarSom()">INICIAR E ATIVAR SOM</button>
    </div>

    <header class="admin-header">
        <h1>SNOOP <span>LANCHE</span></h1>
        <button class="btn-relatorio" onclick="location.reload()">ATUALIZAR</button>
    </header>

    <ul id="pedidos-container"></ul>

    <iframe id="iframe-impressao" style="display:none;"></iframe>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Configuração do Áudio
        const audioAlerta = new Audio('alert.mpeg');
        audioAlerta.loop = true;

        function ativarSom() {
            document.getElementById('container-ativacao').style.display = 'none';
            // Play/Pause rápido para destravar o áudio no navegador/celular
            audioAlerta.play().then(() => audioAlerta.pause());
        }

        function imprimirPedido(id) {
            db.ref('pedidos/' + id).once('value', (snapshot) => {
                const p = snapshot.val();
                if (!snapshot.exists()) return;

                const itensHtml = p.itens.map(i => `
                    <tr>
                        <td style="vertical-align:top; padding:2px 0; width:30px;">${i.qtd}x</td>
                        <td style="padding:2px 0;">${i.produto}</td>
                    </tr>
                `).join('');

                const cupom = `
                    <html>
                    <body style="font-family:'Courier New',monospace; width:80mm; padding:0; margin:0; font-size:14px; color:#000;">
                        <div style="text-align:center; font-weight:bold; border-bottom:1px dashed #000; padding-bottom:5px;">
                            SNOOP LANCHE - ${p.horario}
                        </div>
                        <div style="margin:5px 0;">
                            <b>CLIENTE:</b> ${p.cliente}<br>
                            <b>PGTO:</b> ${p.pagamento || 'A combinar'}
                        </div>
                        <table style="width:100%; border-bottom:1px dashed #000; margin-bottom:5px;">
                            ${itensHtml}
                        </table>
                        <div style="font-size:13px;">
                            <b>OBS:</b> ${p.obs_cozinha || 'Nenhuma'}<br>
                            <b>REF:</b> ${p.referencia || 'Não informado'}<br>
                            <b>END:</b> ${p.endereco}
                        </div>
                    </body>
                    </html>
                `;

                const frame = document.getElementById('iframe-impressao');
                const doc = frame.contentWindow.document;
                doc.open(); doc.write(cupom); doc.close();
                setTimeout(() => { frame.contentWindow.print(); }, 500);
            });
        }

        db.ref('pedidos').on('value', (snapshot) => {
            const container = document.getElementById('pedidos-container');
            container.innerHTML = "";
            let temPendente = false;

            snapshot.forEach(child => {
                const p = child.val();
                const id = child.key;
                const status = p.status || 'pendente';
                if(status === 'pendente') temPendente = true;

                const li = document.createElement('li');
                li.className = `pedido-card status-${status}`;

                let botoes = "";
                if (status === 'pendente') {
                    botoes = `
                        <button class="btn-success" onclick="db.ref('pedidos/${id}').update({status:'preparando'})">ACEITAR PEDIDO</button>
                        <button class="btn-danger" onclick="db.ref('pedidos/${id}').remove()">RECUSAR</button>`;
                } else if (status === 'preparando') {
                    botoes = `
                        <button class="btn-warning" onclick="imprimirPedido('${id}')">IMPRIMIR COZINHA</button>
                        <button class="btn-info" onclick="db.ref('pedidos/${id}').update({status:'entrega'})">ENVIAR P/ ENTREGA</button>`;
                } else if (status === 'entrega') {
                    botoes = `<button class="btn-success" onclick="concluirPedido('${id}')">CONCLUIR PEDIDO</button>`;
                }

                li.innerHTML = `
                    <div class="status-tag">${status.toUpperCase()}</div>
                    <h3>${p.cliente}</h3>
                    <p class="info">${p.endereco}</p>
                    <p class="info"><b>PGTO:</b> ${p.pagamento || 'A combinar'}</p>
                    <div class="itens-box">
                        <b>ITENS:</b><br>
                        ${p.itens.map(i => `• ${i.qtd}x ${i.produto}`).join('<br>')}
                    </div>
                    <p class="obs"><b>OBS:</b> ${p.obs_cozinha || 'Sem observações'}</p>
                    <div class="total">R$ ${parseFloat(p.total).toFixed(2)}</div>
                    <div class="btn-actions">${botoes}</div>
                `;
                container.appendChild(li);
            });

            // Controle do som alert.mpeg
            if (temPendente) {
                audioAlerta.play().catch(e => console.log("Aguardando interação para som"));
            } else {
                audioAlerta.pause();
                audioAlerta.currentTime = 0;
            }
        });

        function concluirPedido(id) {
            db.ref('pedidos/' + id).once('value', s => {
                db.ref('relatorios').push(s.val()).then(() => db.ref('pedidos/' + id).remove());
            });
        }
    </script>
</body>
</html>
