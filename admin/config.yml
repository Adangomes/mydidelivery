backend:
  name: git-gateway
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "cardapio"
    label: "Cardápio Completo"
    files:
      - file: "content/produtos.json"
        label: "Categorias de Produtos"
        name: "produtos_config"
        fields:
          - label: "Produtos"
            name: "produtos"
            widget: "object"
            fields:
              - label: "Hambúrgueres"
                name: "burgers"
                widget: "map" # O segredo está aqui para manter o b1, b2...
                fields:
                  - { label: "Nome", name: "title", widget: "string" }
                  - { label: "Preço", name: "price", widget: "number", value_type: "float" }
                  - { label: "Categoria", name: "categoria", widget: "hidden", default: "burger" }
                  - { label: "Ingredientes", name: "ingredientes", widget: "text" }
                  - { label: "Imagem", name: "image", widget: "image" }
              
              - label: "Bebidas"
                name: "bebidas"
                widget: "map"
                fields:
                  - { label: "Nome", name: "title", widget: "string" }
                  - { label: "Preço", name: "price", widget: "number", value_type: "float" }
                  - { label: "Categoria", name: "categoria", widget: "hidden", default: "bebida" }
                  - { label: "Descrição", name: "ingredientes", widget: "string" }
                  - { label: "Imagem", name: "image", widget: "image" }

              - label: "Pizzas"
                name: "pizzas"
                widget: "map"
                fields:
                  - { label: "Nome da Pizza", name: "nome", widget: "string" }
                  - { label: "Categoria", name: "categoria", widget: "hidden", default: "pizza" }
                  - { label: "Ingredientes", name: "ingredientes", widget: "text" }
                  - { label: "Imagem", name: "imagem", widget: "image" }
                  - label: "Preços", name: "precos", widget: "object", fields:
                    - label: "Pequena"
                      name: "Pequena"
                      widget: "object"
                      fields: 
                        - { label: "Atual", name: "atual", widget: "number" }
                    - label: "Média"
                      name: "Media"
                      widget: "object"
                      fields: 
                        - { label: "Atual", name: "atual", widget: "number" }
                    - label: "Grande"
                      name: "Grande"
                      widget: "object"
                      fields: 
                        - { label: "Atual", name: "atual", widget: "number" }
