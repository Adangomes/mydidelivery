backend:
  name: git-gateway
  branch: main

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "cardapio"
    label: "Cardápio Completo"
    files:
      - file: "content/produtos.json"
        label: "Categorias de Produtos"
        name: "produtos_config"
        fields:
          - label: "Lista Geral de Produtos"
            name: "produtos"
            widget: "list"
            summary: '{{title}} ({{categoria}})'
            fields:
              - { label: "Nome", name: "title", widget: "string" }
              - { label: "Categoria", name: "categoria", widget: "string" }
              - { label: "Ingredientes/Descrição", name: "ingredientes", widget: "text" }
              - { label: "Imagem", name: "image", widget: "image" }
              - { label: "Preço Único (Burger/Dog/Bebida/Parmediana)", name: "price", widget: "number", value_type: "float", required: false }
              - { label: "Preço Antigo (Para aparecer riscado)", name: "oldPrice", widget: "number", value_type: "float", required: false }
              
              - label: "Preços por Tamanho (Pizza/Porção)"
                name: "prices"
                widget: "object"
                required: false
                fields:
                  - { label: "Pequena / 600g", name: "P", widget: "number", value_type: "float", required: false }
                  - { label: "Média (Só Pizza)", name: "M", widget: "number", value_type: "float", required: false }
                  - { label: "Grande / 1kg", name: "G", widget: "number", value_type: "float", required: false }

  - name: "configuracoes"
    label: "Configurações da Loja"
    files:
      - file: "content/status.json"
        label: "Status e Horários"
        name: "status_loja"
        fields:
          - { label: "Hora de Abertura (Ex: 18:00)", name: "horaAbre", widget: "string", default: "18:00" }
          - { label: "Hora de Fechamento (Ex: 23:30)", name: "horaFecha", widget: "string", default: "23:30" }
          - label: "Dias de Funcionamento"
            name: "diasFuncionamento"
            widget: "select"
            multiple: true
            options:
              - { label: "Domingo", value: "0" }
              - { label: "Segunda", value: "1" }
              - { label: "Terça", value: "2" }
              - { label: "Quarta", value: "3" }
              - { label: "Quinta", value: "4" }
              - { label: "Sexta", value: "5" }
              - { label: "Sábado", value: "6" }

