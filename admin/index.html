<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | Snoop & Cervejaria</title>
  
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>

  <script>
    // 3. Script de segurança para redirecionamento
    if (window.netlifyIdentity) {
      // Quando o usuário fizer login, ele garante que permanece no /admin/
      window.netlifyIdentity.on("login", () => {
        document.location.href = "/admin/";
      });
      // Quando deslogar, ele volta para a página inicial do site
      window.netlifyIdentity.on("logout", () => {
        document.location.href = "/";
      });
    }
  </script>
</body>
</html>
