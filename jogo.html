<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tiger Slot - Marcos & Rose Pro</title>
    <style>
        :root { --gold: #d4af37; --red: #8b0000; --neon: #00ff00; }
        body { background: #0a0a0a; color: gold; font-family: 'Arial Black', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        .balance-box { background: rgba(255,255,255,0.1); padding: 10px 30px; border-radius: 50px; border: 2px solid var(--gold); margin-bottom: 15px; }
        .balance-box span { color: var(--neon); font-size: 28px; }

        .slot-machine { border: 8px solid var(--gold); background: var(--red); padding: 15px; border-radius: 20px; box-shadow: 0 0 50px rgba(212, 175, 55, 0.4); }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; }
        .reel { width: 100px; height: 100px; background: #fff; border: 4px solid var(--gold); font-size: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }

        .controls { text-align: center; margin-top: 20px; }
        button { padding: 15px 40px; font-size: 22px; background: linear-gradient(180deg, #ffd700, #b8860b); border: none; cursor: pointer; border-radius: 50px; font-weight: bold; color: #333; box-shadow: 0 5px 0 #664d00; }
        button:disabled { background: #444; color: #888; box-shadow: none; transform: translateY(3px); }

        /* Modal de Bônus */
        #bonusModal { 
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); align-items: center; justify-content: center; text-align: center;
        }
        .modal-content { animation: pulse 1s infinite alternate; }
        .modal-content h1 { font-size: 60px; color: #fff; text-shadow: 0 0 20px var(--neon); margin: 0; }
        
        @keyframes pulse { from { transform: scale(0.9); } to { transform: scale(1.1); } }
        .free-spin-mode { border-color: var(--neon) !important; box-shadow: 0 0 30px var(--neon) !important; }
    </style>
</head>
<body>

    <div class="balance-box">SALDO: R$ <span id="balance">10.00</span></div>
    
    <div class="slot-machine" id="machine">
        <div class="grid" id="slotGrid">
            <div class="reel" id="r0">🐯</div><div class="reel" id="r1">💰</div><div class="reel" id="r2">🧧</div>
            <div class="reel" id="r3">💎</div><div class="reel" id="r4">🐯</div><div class="reel" id="r5">💎</div>
            <div class="reel" id="r6">🧧</div><div class="reel" id="r7">💰</div><div class="reel" id="r8">🐯</div>
        </div>
        <div class="controls">
            <button id="spinBtn" onclick="initSpin()">GIRAR (R$ 1,00)</button>
        </div>
    </div>

    <h3 id="statusMsg" style="color: white; margin-top: 15px;">MARCOS & ROSE SLOT</h3>

    <div id="bonusModal">
        <div class="modal-content">
            <h1 id="modalTitle">MODO BÔNUS!</h1>
            <p id="modalDetail" style="font-size: 30px; color: gold;"></p>
        </div>
    </div>

    <script>
        let balance = 10.00;
        let spinCount = 0;
        let autoSpinsRemaining = 0;
        const symbols = ['🐯', '💰', '🧧', '🍊', '💎'];
        const gridEls = Array.from({length: 9}, (_, i) => document.getElementById(`r${i}`));

        async function initSpin() {
            if (balance < 1 && autoSpinsRemaining <= 0) return alert("Sem saldo!");
            
            if (autoSpinsRemaining <= 0) {
                balance -= 1;
                spinCount++;
            } else {
                autoSpinsRemaining--;
            }

            updateUI();
            toggleControls(false);

            // Animação de Giro
            let ticks = 0;
            const timer = setInterval(() => {
                gridEls.forEach(el => el.innerText = symbols[Math.floor(Math.random() * symbols.length)]);
                ticks++;
                if (ticks > 20) {
                    clearInterval(timer);
                    applyLogic();
                }
            }, 60);
        }

        function applyLogic() {
            // 4ª Rodada: DIAMANTES (R$ 20)
            if (spinCount === 4 && autoSpinsRemaining === 0) {
                gridEls.forEach(el => el.innerText = '💎');
                balance += 20;
                showModal("💎 BIG WIN 💎", "VOCÊ GANHOU R$ 20,00!");
            }
            // 7ª Rodada: 10 GIROS AUTOMÁTICOS
            else if (spinCount === 7 && autoSpinsRemaining === 0) {
                gridEls.forEach(el => el.innerText = '🐯');
                autoSpinsRemaining = 10;
                showModal("🐯 TIGER FREE SPINS 🐯", "10 GIROS GRÁTIS ATIVADOS!");
            }
            // 15ª Rodada: DUPLICA BANCA
            else if (spinCount === 15 && autoSpinsRemaining === 0) {
                balance *= 2;
                showModal("💰 BANCA DUPLICADA 💰", "SEU SALDO DOBROU!");
            }
            else {
                checkLines();
            }

            finalizeStep();
        }

        function checkLines() {
            const g = gridEls.map(el => el.innerText);
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8]];
            let win = 0;

            lines.forEach(l => {
                if (g[l[0]] === g[l[1]] && g[l[1]] === g[l[2]]) win += (balance * 0.005);
            });

            if (win > 0) {
                balance += win;
                document.getElementById('statusMsg').innerText = `VITÓRIA: R$ ${win.toFixed(2)}`;
            }
            updateUI();
        }

        function finalizeStep() {
            if (autoSpinsRemaining > 0) {
                document.getElementById('machine').classList.add('free-spin-mode');
                document.getElementById('statusMsg').innerText = `GIROS RESTANTES: ${autoSpinsRemaining}`;
                setTimeout(initSpin, 1500);
            } else {
                document.getElementById('machine').classList.remove('free-spin-mode');
                toggleControls(true);
            }
        }

        function showModal(title, detail) {
            const modal = document.getElementById('bonusModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDetail').innerText = detail;
            modal.style.display = 'flex';
            setTimeout(() => modal.style.display = 'none', 3000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function toggleControls(enable) {
            document.getElementById('spinBtn').disabled = !enable;
        }
        
        


    </script>
</body>
</html>
