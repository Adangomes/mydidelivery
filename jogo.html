<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger Slot</title>

<style>
:root { --gold:#ffd700; --red:#bc0000; --neon:#00ff00; }

body{
    background:#000;
    color:var(--gold);
    font-family:Arial Black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.game-container{
    width:100%;
    max-width:400px;
    text-align:center;
}

.balance-box{
    font-size:26px;
    margin-bottom:10px;
}

input{
    width:80%;
    padding:10px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.reel{
    aspect-ratio:1/1;
    background:#fff;
    border:3px solid var(--gold);
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
}

button{
    width:80%;
    padding:15px;
    margin-top:10px;
    font-size:18px;
}

.free-spin-mode{
    box-shadow:0 0 20px var(--neon);
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:#fff;
    font-size:30px;
}
</style>
</head>

<body>

<div class="game-container">

<div class="balance-box">SALDO: R$ <span id="balance">100.00</span></div>

<input type="number" id="betInput" value="2" min="1">

<div class="grid" id="slotGrid">
<div class="reel" id="r0">❓</div><div class="reel" id="r1">❓</div><div class="reel" id="r2">❓</div>
<div class="reel" id="r3">❓</div><div class="reel" id="r4">❓</div><div class="reel" id="r5">❓</div>
<div class="reel" id="r6">❓</div><div class="reel" id="r7">❓</div><div class="reel" id="r8">❓</div>
</div>

<button id="spinBtn" onclick="initSpin()">GIRAR R$ 2,00</button>

<h3 id="statusMsg">BOA SORTE!</h3>

<hr>

<input type="text" id="pixKey" placeholder="Digite sua chave Pix">
<button onclick="sacarPix()">SACAR</button>

</div>

<div id="modal" class="modal"></div>

<script>

let balance = 100;
let spinCount = 0;
let autoSpinsRemaining = 0;
let isAuto = false;

const symbols = ['🐯','💰','🧧','🍊','💎'];
const gridEls = Array.from({length:9},(_,i)=>document.getElementById(`r${i}`));

function updateUI(){
    document.getElementById("balance").innerText = balance.toFixed(2);
    let bet = getBet();
    document.getElementById("spinBtn").innerText = `GIRAR R$ ${bet.toFixed(2)}`;
}

function getBet(){
    return parseFloat(document.getElementById("betInput").value) || 1;
}

function randomSpin(){
    gridEls.forEach(el=>{
        el.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    });
}

function diamonds(){
    gridEls.forEach(el=> el.innerText="💎");
}

function initSpin(){

    let bet = getBet();

    if(!isAuto){
        if(balance < bet) return alert("Sem saldo!");
        balance -= bet;
        spinCount++;
    }else{
        autoSpinsRemaining--;
    }

    toggleControls(false);

    let ticks = 0;
    let timer = setInterval(()=>{
        randomSpin();
        ticks++;

        if(ticks > 12){
            clearInterval(timer);
            applyLogic();
        }
    },80);

    updateUI();
}

function applyLogic(){

    // INICIAR FREE SPINS
    if(spinCount === 7 && !isAuto){
        isAuto = true;
        autoSpinsRemaining = 10;
        showModal("FREE SPINS!");
        finalize();
        return;
    }

    // ÚLTIMO GIRO AUTO
    if(isAuto && autoSpinsRemaining === 0){
        diamonds();
        balance += 150;
        isAuto = false;
        showModal("💎 GANHOU R$150!");
        updateUI();
        finalize();
        return;
    }

    checkWin();
    finalize();
}

function checkWin(){
    const g = gridEls.map(el=>el.innerText);
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8]];

    let win = 0;
    let bet = getBet();

    lines.forEach(l=>{
        if(g[l[0]]===g[l[1]] && g[l[1]]===g[l[2]]){
            win += bet * 2;
        }
    });

    if(win > 0){
        balance += win;
        document.getElementById("statusMsg").innerText = `GANHOU R$ ${win.toFixed(2)}`;
    }
}

function finalize(){
    if(isAuto && autoSpinsRemaining > 0){
        document.getElementById("statusMsg").innerText = `GIROS GRÁTIS: ${autoSpinsRemaining}`;
        setTimeout(initSpin,1000);
    }else{
        document.getElementById("statusMsg").innerText = "BOA SORTE!";
        toggleControls(true);
    }
}

function toggleControls(enable){
    document.getElementById("spinBtn").disabled = !enable;
}

// PIX
function sacarPix(){
    let chave = document.getElementById("pixKey").value;
    if(!chave) return alert("Digite a chave Pix!");

    showModal("Sistema atualizando...");

    setTimeout(()=>{
        hideModal();
        alert("Saque solicitado!");
    },2000);
}

// MODAL
function showModal(msg){
    let m = document.getElementById("modal");
    m.style.display = "flex";
    m.innerText = msg;
}

function hideModal(){
    document.getElementById("modal").style.display = "none";
}

updateUI();

</script>

</body>
</html>
