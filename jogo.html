<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger Slot PRO</title>

<style>
:root { --gold:#ffd700; --red:#bc0000; --neon:#00ff00; }

body{
    background:#000;
    color:var(--gold);
    font-family:Arial Black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.game{
    width:350px;
    text-align:center;
}

.reel{
    width:80px;height:80px;
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:3px solid gold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

button{
    padding:15px;
    margin-top:10px;
    width:100%;
    font-weight:bold;
}

input{
    padding:10px;
    width:100%;
    margin-top:10px;
}

.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:30px;
}
</style>
</head>

<body>

<div class="game">

<h2>SALDO: R$ <span id="balance">100</span></h2>

<input type="number" id="bet" value="2" min="1">

<div class="grid" id="grid"></div>

<button onclick="spin()">GIRAR</button>

<hr>

<input type="text" id="pix" placeholder="Digite sua chave Pix">
<button onclick="sacar()">SACAR</button>

</div>

<div id="modal" class="modal"></div>

<script>

let balance = 100;
let autoSpins = 0;
let inAuto = false;

const symbols = ['🐯','💰','🍊','💎','🧧'];
const grid = document.getElementById("grid");

for(let i=0;i<9;i++){
    let div=document.createElement("div");
    div.className="reel";
    div.innerText="❓";
    grid.appendChild(div);
}

function update(){
    document.getElementById("balance").innerText=balance.toFixed(2);
}

function randomGrid(){
    [...grid.children].forEach(el=>{
        el.innerText = symbols[Math.floor(Math.random()*symbols.length)];
    });
}

function diamonds(){
    [...grid.children].forEach(el=>{
        el.innerText="💎";
    });
}

function spin(){

    let bet = parseFloat(document.getElementById("bet").value);

    if(!inAuto){
        if(balance < bet) return alert("Sem saldo");
        balance -= bet;
    }

    randomGrid();

    // INICIAR AUTO SPIN
    if(!inAuto && Math.random() < 0.2){
        inAuto = true;
        autoSpins = 5;
        showModal("FREE SPINS!");
        setTimeout(spin,1000);
        return;
    }

    // AUTO SPINS
    if(inAuto){

        autoSpins--;

        // ÚLTIMO GIRO
        if(autoSpins === 0){
            diamonds();
            balance += 150;
            inAuto = false;
            showModal("💎 GANHOU R$150!");
            update();
            return;
        }

        setTimeout(spin,1000);
    }

    update();
}

function sacar(){
    let chave = document.getElementById("pix").value;

    if(!chave) return alert("Digite a chave Pix");

    showModal("Sistema atualizando...");
    setTimeout(()=>{
        hideModal();
        alert("Saque solicitado!");
    },2000);
}

function showModal(msg){
    let m = document.getElementById("modal");
    m.style.display="flex";
    m.innerText=msg;
}

function hideModal(){
    document.getElementById("modal").style.display="none";
}

update();

</script>

</body>
</html>
