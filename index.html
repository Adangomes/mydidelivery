<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KINGS BURGUER</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <!-- SPLASH -->
    <div id="splash">
        <img src="imagens/splash.jpg" class="splash-logo" alt="Kings Burguer">
    </div>

    <!-- LOADING TAXA -->
    <div id="loading-taxa" style="display:none" class="loading">
        <div class="spinner"></div>
        <p>Calculando taxa...</p>
    </div>

    <!-- CONTEÚDO -->
    <div id="menu">

        <header class="header">
            <div class="logo">KINGS BURGUER</div>
            <div id="status-loja" class="status"></div>

            <button class="hamburger" id="hamburger">&#9776;</button>

            <nav class="menu" id="mobile-menu">
                <a href="bebidas.html">BEBIDAS</a>
                <a href="contato.html">CONTATO</a>
                <a href="index.html">HAMBÚRGUERES</a>
            </nav>

            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </header>

        <section class="secao">
            <div id="burgers" class="cards"></div>
        </section>

        <footer class="footer">
            <p>Sistema Desenvolvido por Adan Gomes</p>
        </footer>
    </div>

    <!-- CARRINHO -->
    <div id="cart-modal" style="display:none;">
        <div class="cart-box">
            <div class="cart-header">
                <h2>Meu Carrinho</h2>
                <button onclick="fecharCarrinho()">X</button>
            </div>

            <div id="cart-items"></div>

            <div class="summary">
                <p id="subtotal">Subtotal: R$0,00</p>
                <p><strong id="total">Total: R$0,00</strong></p>
            </div>

            <div class="buttons">
                <button onclick="fecharCarrinho()">Continuar</button>
                <button onclick="abrirDelivery()">Finalizar compra</button>
            </div>
        </div>
    </div>

    <!-- ENTREGA -->
    <div id="delivery-modal" style="display:none;">
        <div class="delivery-box">
            <h2>Informações de Entrega</h2>

            <label>Nome:</label>
            <input type="text" id="nomeCliente">

            <label>Cidade:</label>
            <select id="cidade">
                <option value="">Selecione</option>
                <option value="Jaraguá do Sul">Jaraguá do Sul</option>
                <option value="Guaramirim">Guaramirim</option>
            </select>

            <label>Bairro:</label>
            <input type="text" id="bairro">

            <label>Rua:</label>
            <input type="text" id="rua">

            <label>Número:</label>
            <input type="text" id="numero">

            <label>Observações:</label>
            <textarea id="observacao"></textarea>

            <label>Pagamento:</label>
            <select id="pagamento">
                <option value="">Selecione</option>
                <option value="Pix">Pix</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Crédito">Crédito</option>
                <option value="Débito">Débito</option>
            </select>

            <div class="buttons">
                <button onclick="fecharDelivery()">Voltar</button>
                <button onclick="mostrarResumo()">Próximo</button>
            </div>
            <div class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

            <!-- RESUMO -->
            <div id="resumo-pedido" style="display:none">
                <h3>Resumo</h3>
                <div id="resumo-itens"></div>
                <p id="resumo-taxa"></p>
                <p id="resumo-total"></p>

                <button onclick="finalizarEntrega()">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
