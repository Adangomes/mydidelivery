<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOOP LANCHE</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div id="toast-geral" class="toast">Produto adicionado!</div>

    <header class="header">
        <div class="header-top">
            <div class="logo">SNOOP LANCHE</div>
            <div id="status-loja" class="status">CARREGANDO...</div>
            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </div>
    </header>

    <nav id="categorias-nav" class="categorias-nav">
        <div id="categorias-scroll" class="categorias-scroll">
            </div>
    </nav>

    <main id="cardapio-corpo" class="container-main"></main>

    <footer class="footer">
        <p>Sistema Desenvolvido por Adan Gomes</p>
    </footer>

    <div id="cart-modal" class="modal-overlay" style="display:none;">
        <div class="cart-box">
            <div class="cart-header">
                <h2>Meu Carrinho</h2>
                <button onclick="fecharCarrinho()">✕</button>
            </div>
            <div id="cart-items"></div>
            <div class="summary">
                <p id="subtotal">Subtotal: R$ 0,00</p>
                <p><strong id="total">Total: R$ 0,00</strong></p>
            </div>
            <div class="buttons">
                <button class="btn-continuar" onclick="fecharCarrinho()">Continuar</button>
                <button class="btn-finalizar" onclick="abrirDelivery()">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <div id="delivery-modal" class="modal-overlay" style="display:none;">
        <div class="delivery-box">
            <div id="form-entrega">
                <h3>Endereço de Entrega</h3>
                <input type="text" id="nomeCliente" placeholder="Seu Nome">
                <input type="text" id="rua" placeholder="Rua">
                <input type="text" id="numero" placeholder="Número">
                <input type="text" id="bairro" placeholder="Bairro">
                <input type="text" id="cidade" placeholder="Cidade" value="Jaraguá do Sul">
                <select id="pagamento">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                </select>
                <div class="buttons">
                    <button onclick="document.getElementById('delivery-modal').style.display='none'">Cancelar</button>
                    <button onclick="mostrarResumo()">Calcular Taxa</button>
                </div>
            </div>

            <div id="resumo-pedido" style="display:none;">
                <h3>Resumo Final</h3>
                <div id="resumo-itens"></div>
                <hr>
                <p id="resumo-taxa"></p>
                <h4 id="resumo-total"></h4>
                <button class="btn-confirmar-final" onclick="enviarWhatsApp()">Enviar para WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="loading-taxa" style="display:none;">
        <div class="spinner"></div>
    </div>

    <div id="pizza-options-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <img id="modal-pizza-img" src="" alt="">
                <button onclick="fecharModalPizza()" class="btn-fechar">✕</button>
            </div>
            <div class="modal-content">
                <h2 id="pizza-modal-title"></h2>
                <p id="pizza-modal-desc"></p>
                <label>1. Escolha o Tamanho:</label>
                <div id="pizza-sizes-container" class="grid-tamanhos"></div>
                <div id="secao-sabores" style="display:none; margin-top:20px;">
                    <label id="contador-fatias">2. Escolha os Sabores:</label>
                    <div id="lista-sabores-meia" class="lista-fatias-scroll"></div>
                </div>
            </div>
            <footer class="modal-footer">
                <button onclick="confirmarPizza()" class="btn-confirmar">Adicionar Pizza</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
