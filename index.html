<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOOP LANCHE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="toast-geral" class="toast-custom">Produto adicionado! ✅</div>

<header class="header">
    <div class="header-top">
        <div class="logo-container">
            <div class="logo">SNOOP LANCHE</div>
            <div id="status-loja" class="status">VERIFICANDO...</div>
        </div>
        <div id="cart-icon-container" class="cart" onclick="abrirCarrinho()">
            <span class="cart-emoji">🛒</span>
            <span id="cart-count" class="cart-badge">0</span>
        </div>
    </div>
</header>

<nav id="categorias-nav" class="categorias-nav">
    <div id="categorias-scroll" class="categorias-scroll"></div>
</nav>

<main id="cardapio-corpo" class="container-main">
    </main>

<div id="pizza-options-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header-clean">
            <h3 id="pizza-modal-title">Escolha os Sabores</h3>
            <button onclick="document.getElementById('pizza-options-modal').style.display='none'" class="btn-fechar-modal">✕</button>
        </div>
        
        <div id="pizza-sizes-container" style="display:none;"></div>
        
        <div id="secao-sabores">
            <p class="instrucao-modal">Selecione conforme o limite do tamanho:</p>
            <div id="lista-sabores-meia" class="lista-check-custom"></div>
        </div>

        <div class="modal-actions mt-3">
            <button id="btn-confirmar-pizza" class="btn-principal" onclick="confirmarPizza()">Confirmar Seleção</button>
        </div>
    </div>
</div>

<div id="cart-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header-clean">
            <h3>Meu Carrinho</h3>
            <button onclick="fecharCarrinho()" class="btn-fechar-modal">✕</button>
        </div>

        <div id="cart-items" class="cart-items-list"></div>

        <div class="cupom-secao">
            <div class="cupom-container">
                <input type="text" id="input-cupom" placeholder="Cupom de desconto">
                <button id="btn-aplicar-cupom">Aplicar</button>
            </div>
            <div id="msg-cupom-feedback" class="cupom-msg-erro"></div>
        </div>

        <div class="summary-box">
            <div class="summary-line"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
            <div class="summary-line total"><span>Total</span><span id="total">R$ 0,00</span></div>
        </div>

        <div class="modal-actions">
            <button class="btn-finalizar" onclick="abrirDelivery()">Finalizar Pedido</button>
            <button class="btn-continuar" onclick="fecharCarrinho()">Continuar Comprando</button>
        </div>
    </div>
</div>

<div id="delivery-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div id="form-entrega">
            <div class="modal-header-clean">
                <h3>Dados para Entrega</h3>
                <button onclick="document.getElementById('delivery-modal').style.display='none'" class="btn-fechar-modal">✕</button>
            </div>
            <div class="form-grid">
                <input type="text" id="nomeCliente" placeholder="Seu Nome">
                <select id="cidade">
                    <option value="Jaraguá do Sul">Jaraguá do Sul</option>
                    <option value="Guaramirim">Guaramirim</option>
                </select>
                <div class="row-inputs">
                    <input type="text" id="rua" placeholder="Rua" style="flex:3">
                    <input type="text" id="numero" placeholder="Nº" style="flex:1">
                </div>
                <input type="text" id="bairro" placeholder="Bairro">
                <select id="pagamento" onchange="toggleTroco(this.value)">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
                <div id="div-troco" style="display:none;">
                    <input type="text" id="trocoPara" placeholder="Troco para quanto?">
                </div>
            </div>
            <button class="btn-principal w-100 mt-3" onclick="mostrarResumo()">Próximo</button>
        </div>

        <div id="resumo-pedido" style="display:none;">
            <div class="modal-header-clean"><h3>Resumo Final</h3></div>
            <div id="resumo-itens" class="resumo-lista"></div>
            <div id="resumo-taxa" class="resumo-valores"></div>
            <h4 id="resumo-total" class="resumo-total-final text-center mt-3"></h4>
            <div class="modal-actions">
                <button class="btn-secundario" onclick="voltarParaEntrega()">Voltar</button>
                <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar para WhatsApp</button>
            </div>
        </div>
    </div>
</div>

<footer class="footer-creditos">
    <p>Sistema Desenvolvido por <strong>Adan Gomes</strong></p>
</footer>

</body>
</html>
