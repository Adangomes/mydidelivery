<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOOP LANCHE</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div id="toast-geral" class="toast-aviso">Produto adicionado!</div>

    <header class="header">
        <div class="header-top">
            <div class="logo">SNOOP LANCHE</div>
            <div id="status-loja" class="status"></div>
            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </div>
    </header>

    <main id="cardapio-corpo" class="container-main">
        </main>

    <footer class="footer">
        <p>Sistema Desenvolvido por Adan Gomes</p>
    </footer>

    <div id="cart-modal" class="modal-overlay" style="display:none;">
        <div class="cart-box">
            <div class="cart-header">
                <h2>Meu Carrinho</h2>
                <button onclick="fecharCarrinho()">✕</button>
            </div>
            <div id="cart-items"></div>
            <div class="summary">
                <p id="subtotal">Subtotal: R$ 0,00</p>
                <p><strong id="total">Total: R$ 0,00</strong></p>
            </div>
            <div class="buttons">
                <button class="btn-continuar" onclick="fecharCarrinho()">Continuar Comprando</button>
                <button class="btn-finalizar" onclick="abrirDelivery()">Finalizar Pedido</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
