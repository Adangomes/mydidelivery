<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1 id="nome-loja">Carregando...</h1>
            <div id="status-loja" class="status">Verificando...</div>
        </div>
    </header>

    <nav id="categorias-scroll" class="categorias-nav">
        </nav>

    <main id="cardapio-corpo">
        <div class="loader-container">
            <p>Carregando delícias...</p>
        </div>
    </main>

    <div id="btn-carrinho-flutuante" onclick="abrirCarrinho()">
        <i class="fas fa-shopping-basket"></i>
        <span id="cart-count">0</span>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharCarrinho()">&times;</span>
            <h2>Seu Pedido</h2>
            <div id="cart-items">
                </div>
            <div class="cart-footer">
                <p>Subtotal: <span id="subtotal">R$ 0,00</span></p>
                <p><strong>Total: <span id="total">R$ 0,00</span></strong></p>
                <button class="btn-finalizar" onclick="abrirDelivery()">Continuar</button>
            </div>
        </div>
    </div>

    <div id="delivery-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('delivery-modal').style.display='none'">&times;</span>
            
            <div id="form-entrega">
                <h2>Dados de Entrega</h2>
                <input type="text" id="nomeCliente" placeholder="Seu Nome" required>
                <input type="text" id="rua" placeholder="Rua / Logradouro" required>
                <input type="text" id="numero" placeholder="Número" required>
                <input type="text" id="bairro" placeholder="Bairro" required>
                <select id="cidade">
                    <option value="Jaraguá do Sul">Jaraguá do Sul</option>
                    <option value="Guaramirim">Guaramirim</option>
                    <option value="Schroeder">Schroeder</option>
                </select>
                <input type="text" id="pontoReferencia" placeholder="Ponto de Referência (Opcional)">
                
                <h3>Pagamento</h3>
                <select id="pagamento" onchange="toggleTroco(this.value)">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão (Maquininha)</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>

                <div id="div-troco" style="display:none;">
                    <input type="text" id="trocoPara" placeholder="Troco para quanto?">
                </div>

                <textarea id="obsCozinha" placeholder="Alguma observação? (Ex: Tirar cebola)"></textarea>

                <div id="loading-taxa" style="display:none; color: orange; font-weight: bold;">
                    Calculando frete...
                </div>

                <button class="btn-finalizar" onclick="mostrarResumo()">Ver Resumo</button>
            </div>

            <div id="resumo-pedido" style="display:none;">
                <h2>Resumo do Pedido</h2>
                <div id="resumo-itens"></div>
                <div id="resumo-taxa" class="taxa-info"></div>
                <h3 id="resumo-total"></h3>
                <button class="btn-whatsapp" onclick="enviarWhatsApp()">
                    <i class="fab fa-whatsapp"></i> Enviar para o WhatsApp
                </button>
                <button class="btn-voltar" onclick="voltarParaEntrega()">Corrigir Endereço</button>
            </div>
        </div>
    </div>

    <div id="pizza-options-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModalPizza()">&times;</span>
            <h2 id="pizza-modal-title">Escolha suas opções</h2>
            
            <p class="label-step">Quantos sabores?</p>
            <div id="pizza-sizes-container" class="options-grid"></div>

            <div id="secao-sabores" style="display:none;">
                <p class="label-step">Selecione os sabores:</p>
                <div id="lista-sabores-meia" class="options-list"></div>
            </div>

            <button id="btn-confirmar-pizza" class="btn-finalizar" disabled onclick="confirmarPizza()">
                Selecionar opções
            </button>
        </div>
    </div>

    <div id="toast-geral" class="toast">Produto adicionado!</div>

    <script src="script.js"></script>
</body>
</html>
