<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEBIDAS</title>
<!-- CSS principal -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="menu">

        <!-- HEADER -->
        <header class="header">
            <div class="logo">KINGS BURGUER</div>
            <div id="status-loja" class="status"></div>

            <!-- Botão menu hamburguer -->
            <button class="hamburger" id="hamburger">&#9776;</button>

            <!-- Menu mobile -->
            <nav class="menu" id="mobile-menu">
                <a href="index.html">BURGUER</a>
                <a href="bebidas.html">BEBIDAS</a>
                <a href="contato.html">CONTATO</a>
            </nav>

           <!-- CARRINHO -->
    <div id="cart-modal" style="display:none;">
        <div class="cart-box">
            <div class="cart-header">
                <h2>Meu Carrinho</h2>
                <button onclick="fecharCarrinho()">X</button>
            </div>

            <div id="cart-items"></div>

            <div class="summary">
                <p id="subtotal">Subtotal: R$0,00</p>
                <p><strong id="total">Total: R$0,00</strong></p>
            </div>

            <div class="buttons">
                <button onclick="fecharCarrinho()">Continuar</button>
                <button onclick="abrirDelivery()">Finalizar compra</button>
            </div>
        </div>
    </div>

    <!-- ENTREGA -->
    <div id="delivery-modal" style="display:none;">
        <div class="delivery-box">
            <h2>Informações de Entrega</h2>

            <label>Nome:</label>
            <input type="text" id="nomeCliente">

            <label>Cidade:</label>
            <select id="cidade">
                <option value="">Selecione</option>
                <option value="Jaraguá do Sul">Jaraguá do Sul</option>
                <option value="Guaramirim">Guaramirim</option>
            </select>

            <label>Bairro:</label>
            <input type="text" id="bairro">

            <label>Rua:</label>
            <input type="text" id="rua">

            <label>Número:</label>
            <input type="text" id="numero">

            <label>Observações:</label>
            <textarea id="observacao"></textarea>

            <label>Pagamento:</label>
            <select id="pagamento">
                <option value="">Selecione</option>
                <option value="Pix">Pix</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Crédito">Crédito</option>
                <option value="Débito">Débito</option>
            </select>

            <div class="buttons">
                <button onclick="fecharDelivery()">Voltar</button>
                <button onclick="mostrarResumo()">Próximo</button>
            </div>
            <div class="text-center">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

            <!-- RESUMO -->
            <div id="resumo-pedido" style="display:none">
                <h3>Resumo</h3>
                <div id="resumo-itens"></div>
                <p id="resumo-taxa"></p>
                <p id="resumo-total"></p>

                <button onclick="finalizarEntrega()">Finalizar Pedido</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast">
    ✅ Produto adicionado ao carrinho
</div>

    <!-- SCRIPT SEMPRE ANTES DO BODY FECHAR -->
    <script src="script.js"></script>

</body>


</html>
