<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOOP LANCHE - Porções</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Apenas estilos estruturais do modal que são específicos desta tela */
        .modal-pizza-full {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 10px;
        }
        .modal-pizza-container {
            background: #fff;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            border-radius: 20px;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .btn-fechar-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 35px; height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
        .pizza-header-img img { width: 100%; height: 200px; object-fit: cover; }
        .pizza-details { padding: 20px; }
        .secao-titulo { font-weight: bold; background: #f4f4f4; padding: 8px 15px; border-radius: 8px; margin-top: 15px; margin-bottom: 10px; }
        .sizes-row { display: flex; gap: 10px; justify-content: space-between; }
        .btn-tamanho-opcional { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; text-align: center; }
        .btn-tamanho-opcional.ativo { border-color: #ffc107; background: #fffdf5; font-weight: bold; }
        .btn-final-adicionar { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px;}
    </style>
</head>
<body>

    <div id="splash" style="display: none;"></div>

    <div id="menu">
        <header class="header">
            <div class="logo">MYDI DELIVERY</div>
            <div id="status-loja" class="status"></div>
            <button class="hamburger" id="hamburger">&#9776;</button>
            <nav class="menu" id="mobile-menu">
                <a href="index.html">BURGUER</a>
                <a href="bebidas.html">BEBIDAS</a>
                <a href="contato.html">CONTATO</a>
                <a href="pizzas.html">PIZZAS</a>
                <a href="dog.html">DOG'S</a>
                <a href="porcoes.html">PORÇÕES</a>
            </nav>
            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </header>

        <section class="secao">
            <div id="porcoes-container" class="cards"></div>
            <div id="pizzas-container" style="display:none;"></div>
        </section>

        <footer class="footer">
            <p>Sistema Desenvolvido por Adan Gomes</p>
        </footer>
    </div>

    <div id="toast-geral" class="toast">
        ✅ Produto adicionado ao carrinho!
    </div>

    <div id="porcao-options-modal" class="modal-pizza-full">
        <div class="modal-pizza-container">
            <button onclick="fecharModalPorcao()" class="btn-fechar-modal">✕</button>
            <div class="pizza-header-img">
                <img id="modal-porcao-img" src="" alt="Porção">
            </div>
            <div class="pizza-details">
                <h2 id="porcao-modal-title"></h2>
                <p id="porcao-modal-desc"></p>
                <div class="secao-titulo">Escolha o Tamanho</div>
                <div id="porcao-sizes-container" class="sizes-row"></div>
                <button id="btn-confirmar-porcao" class="btn-final-adicionar">ADICIONAR AO CARRINHO</button>
            </div>
        </div>
    </div>

    <div id="cart-modal" style="display:none;" class="modal-pizza-full">
        <div class="modal-pizza-container" style="padding: 20px;">
            <h2>Meu Carrinho</h2>
            <div id="cart-items"></div>
            <p id="total">Total: R$ 0,00</p>
            <div style="display:flex; gap:10px;">
                <button onclick="fecharCarrinho()" class="btn-vermelho" style="flex:1">Voltar</button>
                <button onclick="finalizarPedido()" class="btn-final-adicionar" style="flex:1; margin:0">Finalizar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        let porcaoAtual = null;
        let pesoSelecionado = null;
        window.produtosPorcoes = [];

        // Inicializa Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        window.db = firebase.database();

        // Funções do Modal (Globais)
        window.fecharModalPorcao = () => document.getElementById("porcao-options-modal").style.display = "none";

        window.abrirModalPorcao = function(nome) {
            porcaoAtual = window.produtosPorcoes.find(p => p.title === nome);
            if (!porcaoAtual) return;

            document.getElementById("modal-porcao-img").src = porcaoAtual.image;
            document.getElementById("porcao-modal-title").innerText = porcaoAtual.title;
            document.getElementById("porcao-modal-desc").innerText = porcaoAtual.ingredientes;

            const container = document.getElementById("porcao-sizes-container");
            container.innerHTML = "";
            pesoSelecionado = null;

            Object.keys(porcaoAtual.prices).forEach(chave => {
                const btn = document.createElement("button");
                btn.className = "btn-tamanho-opcional";
                let label = (chave === "P") ? "600g" : (chave === "G" ? "1kg" : chave);
                btn.innerHTML = `<strong>${label}</strong><br>R$ ${porcaoAtual.prices[chave].toFixed(2).replace(".", ",")}`;
                
                btn.onclick = (e) => {
                    e.stopPropagation();
                    pesoSelecionado = chave;
                    container.querySelectorAll(".btn-tamanho-opcional").forEach(b => b.classList.remove("ativo"));
                    btn.classList.add("ativo");
                };
                container.appendChild(btn);
            });
            document.getElementById("porcao-options-modal").style.display = "flex";
        };

        // Carregar do JSON
        async function carregarPorcoes() {
            const grid = document.getElementById("porcoes-container");
            try {
                const res = await fetch("content/produtos.json?v=" + Date.now());
                const data = await res.json();
                window.produtosPorcoes = data.produtos.filter(p => p.categoria === "porcao");

                grid.innerHTML = "";
                window.produtosPorcoes.forEach(p => {
                    grid.innerHTML += `
                        <div class="card-produto" onclick="abrirModalPorcao('${p.title}')">
                            <img src="${p.image}">
                            <div class="card-content">
                                <h3>${p.title}</h3>
                                <p>${p.ingredientes}</p>
                                <button class="btn-vermelho">ESCOLHER TAMANHO</button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        // Lógica Adicionar + Toast + Fechar Modal
        document.getElementById("btn-confirmar-porcao").onclick = function() {
            if (!pesoSelecionado) return alert("Selecione um tamanho!");

            const pesoTexto = (pesoSelecionado === "P") ? "600g" : "1kg";
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            carrinho.push({
                title: `${porcaoAtual.title} (${pesoTexto})`,
                price: porcaoAtual.prices[pesoSelecionado],
                qtd: 1
            });
            localStorage.setItem('carrinho', JSON.stringify(carrinho));

            // Ações de fechamento e feedback
            fecharModalPorcao();
            const toast = document.getElementById("toast-geral");
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);

            if (typeof atualizarCarrinho === "function") atualizarCarrinho();
        };

        carregarPorcoes();
    </script>
    
    <script src="script.js"></script>
</body>
</html>
