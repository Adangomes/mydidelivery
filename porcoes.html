    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* MODAL GENÉRICO PARA OPÇÕES (PORÇÕES/PIZZAS) */
        .modal-custom-full {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 10px;
        }
        .modal-custom-container {
            background: #fff;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            border-radius: 20px;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .btn-fechar-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 35px; height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .modal-header-img img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .modal-details { padding: 20px; }
        .secao-titulo {
            font-weight: bold;
            background: #f4f4f4;
            padding: 8px 15px;
            border-radius: 8px;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .sizes-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }
        .btn-tamanho-opcional {
            flex: 1;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-tamanho-opcional.ativo {
            border-color: #ffc107;
            background: #fffdf5;
        }
        .btn-final-adicionar {
            width: 100%;
            background: #28a745;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="menu">
        <header class="header">
            <div class="logo">MYDI DELIVERY</div>
            <div id="status-loja" class="status"></div>

            </nav>

        </header>

            <div id="porcoes" class="cards"></div> </section>

        <footer class="footer"><p>Sistema Desenvolvido por Adan Gomes</p></footer>
    </div>

<!-- MODAL DE PORÇÕES -->
<div id="porcao-modal" class="modal-custom-full">
    <div class="modal-custom-container">
        <button onclick="fecharModalPorcao()" class="btn-fechar-modal">✕</button>
        <div class="modal-header-img">
            <img id="modal-porcao-img" src="" alt="Porção">
        </div>
        <div class="modal-details">
            <h2 id="porcao-modal-title"></h2>
            <p id="porcao-modal-desc"></p>
            <div class="secao-titulo">Escolha o Tamanho</div>
            <div id="porcao-sizes-container" class="sizes-row"></div>
        </div>
        <div style="padding:15px;">
            <button onclick="adicionarPorcaoAoCarrinho()" class="btn-final-adicionar">
                ADICIONAR AO CARRINHO
            </button>
        </div>
    </div>
</div>

<div id="cart-modal" style="display:none;">
    <div class="cart-box">
        <div class="cart-header"><h2>Meu Carrinho</h2><button onclick="fecharCarrinho()">X</button></div>
        <div id="cart-items"></div> <div id="total"></div>
        <button onclick="abrirDelivery()">Finalizar</button>
    </div>
</div>
