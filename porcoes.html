</head>
    <style>
    /* 1. FUNDO DO MODAL (OCUPA A TELA TODA) */
    .modal-pizza-full {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        display: none; 
        justify-content: center;
        align-items: center;
        z-index: 9999;
        padding: 10px;
    }

    /* 2. CAIXA DO CONTEÚDO */
    .modal-pizza-container {
        background: #fff;
        width: 100%;
        max-width: 450px;
        max-height: 90vh;
        border-radius: 20px;
        position: relative;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    /* 3. BOTÃO FECHAR */
    .btn-fechar-modal {
        position: absolute;
        top: 15px; right: 15px;
        background: rgba(255,255,255,0.9);
        border: none;
        width: 35px; height: 35px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 4. IMAGEM DE TOPO */
    .pizza-header-img img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    /* 5. DETALHES E TÍTULOS */
    .pizza-details { padding: 20px; }
    
    #pizza-modal-title { margin: 0 0 5px 0; font-size: 1.5rem; }
    #pizza-modal-desc { color: #666; font-size: 0.9rem; margin-bottom: 20px; }

    .secao-titulo {
        font-weight: bold;
        background: #f4f4f4;
        padding: 8px 15px;
        border-radius: 8px;
        margin-top: 15px;
        margin-bottom: 10px;
    }

    .instrucao {
        font-size: 0.85rem;
        color: #888;
        margin-bottom: 10px;
        display: block;
    }

    /* 6. BOTÕES DE TAMANHO (LINHA) */
    .sizes-row {
        display: flex;
        gap: 10px;
        justify-content: space-between;
    }

    .btn-tamanho-opcional {
        flex: 1;
        padding: 10px;
        border: 2px solid #eee;
        border-radius: 12px;
        background: white;
        cursor: pointer;
        transition: 0.2s;
        text-align: center;
    }

    .btn-tamanho-opcional.ativo {
        border-color: #ffc107;
        background: #fffdf5;
    }

    /* 7. LISTA DE SABORES (HORIZONTAL E VERTICAL AJUSTADOS) */
    .sabores-grid {
        display: flex;
        flex-direction: column; /* Lista vertical */
        gap: 10px;
        margin-top: 10px;
    }

    .item-sabor {
        display: flex;
        justify-content: space-between; /* Nome na esquerda, botões na direita */
        align-items: center;           /* Alinhamento vertical perfeito */
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 12px;
        transition: 0.2s;
        width: 100%;
        box-sizing: border-box; /* Garante que o padding não quebre a largura */
    }

    /* Estilo do nome da pizza dentro da linha */
    .sabor-info {
        flex: 1;
        text-align: left;
        font-weight: 500;
        font-size: 0.95rem;
        color: #333;
    }

    /* Destaque quando selecionado (NOME CONTINUA APARECENDO) */
    .item-sabor.selecionado {
        border: 2px solid #28a745;
        background: #f8fff9;
    }

    .item-sabor.selecionado .sabor-info {
        color: #155724; /* Nome em verde escuro para destaque */
        font-weight: bold;
    }

    /* 8. CONTROLES DE FATIAS (+ e -) */
    .controles-fatias {
        display: flex;
        align-items: center;
        background: #f0f0f0;
        border-radius: 25px;
        padding: 3px;
        margin-left: 10px;
    }

    .btn-fatia {
        background: #000;
        color: #fff;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
    }

    .qtd-fatia {
        min-width: 30px;
        text-align: center;
        font-weight: bold;
        font-size: 16px;
    }

    /* 9. BOTÃO FINAL ADICIONAR */
    .btn-final-adicionar {
        width: 100%;
        background: #28a745;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 20px;
    }

    .btn-final-adicionar:hover { background: #218838; }

</style>

<body>



    <!-- LOADING TAXA -->

        <div class="spinner"></div>
        <p>Calculando taxa...</p>
    </div>

            </nav>

            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </header>

        <section class="secao">
            <div id="porcoes" class="cards"></div>
        </section>

        <footer class="footer">
            <p>Sistema Desenvolvido por Adan Gomes</p>
        </footer>
    </div>

    <!-- CARRINHO -->
    <div id="cart-modal" style="display:none;">
        <div class="cart-box">
            <div class="cart-header">
                <h2>Meu Carrinho</h2>
                <button onclick="fecharCarrinho()">X</button>
            </div>

            <div id="cart-items"></div>

            <div class="summary">
                <p id="subtotal">Subtotal: R$0,00</p>
                <p><strong id="total">Total: R$0,00</strong></p>
            </div>

            <div class="buttons">
                <button onclick="fecharCarrinho()">Continuar</button>
                <button onclick="abrirDelivery()">Finalizar compra</button>
            </div>
        </div>
    </div>

    <!-- ENTREGA -->
    <div id="delivery-modal" style="display:none;">
        <div class="delivery-box">

            <div id="form-entrega">
                <h2>Informações de Entrega</h2>

                <label>Nome:</label>
                <input type="text" id="nomeCliente" placeholder="Seu nome">

                <label>Cidade:</label>
                <select id="cidade">
                <option value="">Selecione</option>
                <option value="Jaraguá do Sul">Jaraguá do Sul</option>      
                <option value="Guaramirim">Guaramirim</option>
                <option value="Guaramirim">Schroeder</option>
            </select>

                <label>Bairro:</label>
                <input type="text" id="bairro" placeholder="Ex: Centro">

                <label>Rua:</label>
                <input type="text" id="rua" placeholder="Nome da rua">

                <label>Número:</label>
                <input type="text" id="numero" placeholder="123">

                <label>Ponto de Referência:</label>
                <textarea id="pontoReferencia" placeholder="Ex: casa dos fundos"></textarea>

                <label>Observações (Cozinha):</label>
                <textarea id="obsCozinha" placeholder="Ex: Sem cebola"></textarea>

                <label>Pagamento:</label>
                <select id="pagamento" onchange="if(this.value=='Dinheiro'){document.getElementById('div-troco').style.display='block'}else{document.getElementById('div-troco').style.display='none'}">
    <option value="">Selecione</option>
    <option value="Pix">Pix</option>
    <option value="Dinheiro">Dinheiro</option>
    <option value="Cartão">Cartão</option>
</select>

                <div id="div-troco" style="display:none; margin-top: 10px;">
                    <label>Precisa de troco para quanto?</label>
                    <input type="text" id="trocoPara" placeholder="Ex: Troco para 50,00">
                </div>
                <div class="buttons">
                    <button onclick="fecharDelivery()">Voltar</button>
                    <button onclick="mostrarResumo()">Próximo</button>
                </div>
            </div>

            <div id="resumo-pedido" style="display:none;">
                <h2 style="margin-bottom: 15px;">Resumo do Pedido</h2>
                <div id="resumo-itens" style="font-size: 0.9rem; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;"></div>
                <p id="resumo-taxa" style="font-weight: 500; margin-bottom: 5px;"></p>
                <p id="resumo-total" style="font-size: 1.2rem; font-weight: 700; color: #111;"></p>

                <div class="buttons" style="margin-top: 20px;">
                    <button onclick="voltarParaDados()">Voltar</button>
                    <button onclick="finalizarEntrega()">Finalizar Pedido</button>
                </div>
            </div>
        </div>

        <div id="loading-taxa">
            <div class="spinner"></div>
            <p style="font-weight: 600;">Calculando taxa...</p>
        </div>
    </div>

        ✅ Produto adicionado ao carrinho
