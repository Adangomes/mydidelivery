<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNOOP LANCHE - Porções</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajustes específicos para o modal de porções carregar corretamente */
        .modal-pizza-full {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 10px;
        }
        .modal-pizza-container {
            background: #fff;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            border-radius: 20px;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .btn-fechar-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            width: 35px; height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
        }
        .pizza-header-img img { width: 100%; height: 200px; object-fit: cover; }
        .pizza-details { padding: 20px; }
        .secao-titulo { font-weight: bold; background: #f4f4f4; padding: 8px 15px; border-radius: 8px; margin-top: 15px; margin-bottom: 10px; }
        .sizes-row { display: flex; gap: 10px; justify-content: space-between; }
        .btn-tamanho-opcional { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 12px; background: white; cursor: pointer; text-align: center; }
        .btn-tamanho-opcional.ativo { border-color: #ffc107; background: #fffdf5; font-weight: bold; }
        .btn-final-adicionar { width: 100%; background: #28a745; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="menu">
        <header class="header">
            <div class="logo">MYDI DELIVERY</div>
            <div id="status-loja" class="status"></div>
            <button class="hamburger" id="hamburger">&#9776;</button>
            <nav class="menu" id="mobile-menu">
                <a href="index.html">BURGUER</a>
                <a href="bebidas.html">BEBIDAS</a>
                <a href="contato.html">CONTATO</a>
                <a href="pizzas.html">PIZZAS</a>
                <a href="dog.html">DOG'S</a>
                <a href="porcoes.html">PORÇÕES</a>
            </nav>
            <div class="cart" onclick="abrirCarrinho()">🛒</div>
        </header>

        <section class="secao">
            <div id="porcoes-container" class="cards"></div>
        </section>

        <footer class="footer">
            <p>Sistema Desenvolvido por Adan Gomes</p>
        </footer>
    </div>

    <div id="toast-geral" class="toast">
        ✅ Produto adicionado ao carrinho!
    </div>

    <div id="porcao-options-modal" class="modal-pizza-full">
        <div class="modal-pizza-container">
            <button onclick="fecharModalPorcao()" class="btn-fechar-modal">✕</button>
            <div class="pizza-header-img">
                <img id="modal-porcao-img" src="" alt="Porção">
            </div>
            <div class="pizza-details">
                <h2 id="porcao-modal-title"></h2>
                <p id="porcao-modal-desc"></p>
                <div class="secao-titulo">Escolha o Tamanho</div>
                <div id="porcao-sizes-container" class="sizes-row"></div>
            </div>
            <div style="padding: 15px;">
                <button id="btn-confirmar-porcao" class="btn-final-adicionar">ADICIONAR AO CARRINHO</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.database();

        let porcaoSelecionada = null;
        let tamanhoSelecionado = null;
        window.carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        // MENU HAMBURGER FUNCIONANDO
        const hamburger = document.getElementById("hamburger");
        const mobileMenu = document.getElementById("mobile-menu");
        if(hamburger) {
            hamburger.onclick = () => mobileMenu.classList.toggle("active");
        }

        // CARREGAR PORÇÕES
        async function carregar() {
            try {
                const res = await fetch("content/produtos.json");
                const data = await res.json();
                const porcoes = data.produtos.filter(p => p.categoria === "porcao");
                window.todosProdutos = data.produtos;
                const grid = document.getElementById("porcoes-container");
                if(!grid) return;
                grid.innerHTML = "";
                porcoes.forEach(p => {
                    grid.innerHTML += `
                        <div class="card-produto" onclick="abrirModalPorcao('${p.title}')" style="cursor:pointer">
                            <img src="${p.image}">
                            <div class="card-content">
                                <h3>${p.title}</h3>
                                <p>${p.ingredientes}</p>
                                <button class="btn-vermelho">ESCOLHER TAMANHO</button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        // ABRIR MODAL
        window.abrirModalPorcao = (nome) => {
            porcaoSelecionada = window.todosProdutos.find(p => p.title === nome);
            document.getElementById("modal-porcao-img").src = porcaoSelecionada.image;
            document.getElementById("porcao-modal-title").innerText = porcaoSelecionada.title;
            document.getElementById("porcao-modal-desc").innerText = porcaoSelecionada.ingredientes;
            const sizesContainer = document.getElementById("porcao-sizes-container");
            sizesContainer.innerHTML = "";
            tamanhoSelecionado = null;
            Object.keys(porcaoSelecionada.prices).forEach(tam => {
                const btn = document.createElement("button");
                btn.className = "btn-tamanho-opcional";
                let label = (tam === "P") ? "600g" : (tam === "G" ? "1kg" : tam);
                btn.innerHTML = `<strong>${label}</strong><br>R$ ${porcaoSelecionada.prices[tam].toFixed(2).replace(".", ",")}`;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    tamanhoSelecionado = tam;
                    document.querySelectorAll(".btn-tamanho-opcional").forEach(b => b.classList.remove("ativo"));
                    btn.classList.add("ativo");
                };
                sizesContainer.appendChild(btn);
            });
            document.getElementById("porcao-options-modal").style.display = "flex";
        }

        window.fecharModalPorcao = () => document.getElementById("porcao-options-modal").style.display = "none";

        // ADICIONAR COM SEU TOAST DO CSS
        document.getElementById("btn-confirmar-porcao").onclick = function() {
            if (!tamanhoSelecionado) { alert("Selecione um tamanho!"); return; }
            const pesoFinal = (tamanhoSelecionado === "P") ? "600g" : "1kg";
            window.carrinho.push({
                title: `${porcaoSelecionada.title} (${pesoFinal})`,
                price: porcaoSelecionada.prices[tamanhoSelecionado],
                qtd: 1
            });
            localStorage.setItem('carrinho', JSON.stringify(window.carrinho));
            
            fecharModalPorcao();
            
            // LOGICA PARA O SEU TOAST .show
            const toast = document.getElementById("toast-geral");
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
            
            if(typeof atualizarCarrinho === "function") atualizarCarrinho();
        };

        carregar();
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXA1yP1F-riNkzOX5zJs5gsQ82EzsT7Qg",
            authDomain: "myproject26-10f0e.firebaseapp.com",
            databaseURL: "https://myproject26-10f0e-default-rtdb.firebaseio.com",
            projectId: "myproject26-10f0e",
            storageBucket: "myproject26-10f0e.firebasestorage.app",
            messagingSenderId: "884850608032",
            appId: "1:884850608032:web:79db6983346c3c20edc6c5"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.database();
    </script>

    <script src="script.js"></script>
</body>
</html>
