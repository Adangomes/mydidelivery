<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Road Fighter Acadêmico V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            border: 4px solid #444;
            background: #333;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .controls {
            display: flex;
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            width: 80px;
            height: 80px;
            background: #555;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            user-select: none;
            cursor: pointer;
        }
        .btn:active { background: #888; }
        #msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 2px solid yellow;
            display: none;
            z-index: 10;
        }
        #timer-bar-container {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none;
        }
        #progress {
            position: absolute; bottom: 0; left: 0; height: 5px; background: #00ff00; width: 0%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>FASE: <span id="level">1</span></div>
            <div>TEMPO: <span id="timer">60</span>s</div>
            <div>BÔNUS: <span id="score">0</span></div>
        </div>
        <div id="progress"></div>
        <div id="msg">
            <h1 id="title">GAME OVER</h1>
            <p id="desc">Pressione R ou o botão central</p>
            <button onclick="resetGame()" style="padding: 10px 20px; cursor:pointer">REINICIAR</button>
        </div>
    </div>

    <div class="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Configurações
    canvas.width = 360;
    canvas.height = 500;
    
    let gameActive = true;
    let level = 1;
    let score = 0;
    let speed = 6;
    let timeLeft = 60; // 1 minuto por fase
    let finishLineY = -1000; // Começa longe
    let showingFinish = false;
    let crossFinish = false;

    const player = { x: 165, y: 400, w: 30, h: 50, color: '#ff0000' };
    let enemies = [];
    let bonuses = [];
    let roadOffset = 0;

    // Teclado e Botões
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    let moveLeft = false;
    let moveRight = false;
    document.getElementById('btnLeft').onmousedown = document.getElementById('btnLeft').ontouchstart = () => moveLeft = true;
    document.getElementById('btnLeft').onmouseup = document.getElementById('btnLeft').ontouchend = () => moveLeft = false;
    document.getElementById('btnRight').onmousedown = document.getElementById('btnRight').ontouchstart = () => moveRight = true;
    document.getElementById('btnRight').onmouseup = document.getElementById('btnRight').ontouchend = () => moveRight = false;

    function spawnEnemy() {
        if (Math.random() < 0.03 && !showingFinish) {
            enemies.push({
                x: 60 + Math.random() * 210,
                y: -60, w: 30, h: 50,
                speed: 1 + Math.random() * 3,
                type: 'enemy',
                color: '#0055ff'
            });
        }
        // Carrinho Colorido (Bônus)
        if (Math.random() < 0.005 && !showingFinish) {
            bonuses.push({
                x: 60 + Math.random() * 210,
                y: -60, w: 30, h: 50,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`
            });
        }
    }

    function update() {
        if (!gameActive) return;

        // Movimentação
        if ((keys['ArrowLeft'] || moveLeft) && player.x > 55) player.x -= 6;
        if ((keys['ArrowRight'] || moveRight) && player.x < 275) player.x += 6;

        // Timer e Lógica de Fase
        timeLeft -= 1/60;
        document.getElementById('timer').innerText = Math.max(0, Math.ceil(timeLeft));
        document.getElementById('progress').style.width = ((60 - timeLeft) / 60 * 100) + "%";

        if (timeLeft <= 0 && !showingFinish) {
            showingFinish = true;
            finishLineY = -100;
        }

        // Movimentar Inimigos
        enemies.forEach((en, i) => {
            en.y += speed + en.speed;
            if (player.x < en.x + en.w && player.x + player.w > en.x &&
                player.y < en.y + en.h && player.y + player.h > en.y) {
                endGame("VOCÊ BATEU!");
            }
            if (en.y > canvas.height) enemies.splice(i, 1);
        });

        // Movimentar Bônus
        bonuses.forEach((b, i) => {
            b.y += speed + 2;
            if (player.x < b.x + b.w && player.x + player.w > b.x &&
                player.y < b.y + b.h && player.y + player.h > b.y) {
                score += 500;
                document.getElementById('score').innerText = score;
                bonuses.splice(i, 1);
            }
            if (b.y > canvas.height) bonuses.splice(i, 1);
        });

        // Linha de Chegada
        if (showingFinish) {
            finishLineY += speed;
            if (finishLineY > player.y && !crossFinish) {
                crossFinish = true;
                setTimeout(nextLevel, 1000);
            }
        }

        spawnEnemy();
        roadOffset += speed;
    }

    function drawCar(x, y, color, isPlayer = false) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 30, 50); // Corpo
        ctx.fillStyle = "#000";
        ctx.fillRect(x-2, y+5, 5, 10); ctx.fillRect(x+27, y+5, 5, 10); // Rodas
        ctx.fillRect(x-2, y+35, 5, 10); ctx.fillRect(x+27, y+35, 5, 10);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillRect(x+5, y+8, 20, 12); // Para-brisa
    }

    function draw() {
        ctx.fillStyle = "#2d5a27"; // Grama
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#444"; // Estrada
        ctx.fillRect(50, 0, 260, canvas.height);

        // Faixas brancas
        ctx.strokeStyle = "#fff";
        ctx.setLineDash([20, 30]);
        ctx.lineDashOffset = -roadOffset;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(180, 0); ctx.lineTo(180, canvas.height);
        ctx.stroke();

        // Linha de Chegada
        if (showingFinish) {
            ctx.fillStyle = "#fff";
            for(let i=0; i<6; i++) {
                for(let j=0; j<2; j++) {
                    if((i+j)%2==0) ctx.fillRect(50 + (i*43.3), finishLineY + (j*20), 43.3, 20);
                }
            }
        }

        bonuses.forEach(b => drawCar(b.x, b.y, b.color));
        enemies.forEach(en => drawCar(en.x, en.y, en.color));
        drawCar(player.x, player.y, player.color, true);

        update();
        requestAnimationFrame(draw);
    }

    function nextLevel() {
        level++;
        if (level > 20) {
            endGame("CAMPEÃO MUNDIAL!");
            return;
        }
        speed += 1.5;
        timeLeft = 60;
        showingFinish = false;
        crossFinish = false;
        enemies = [];
        bonuses = [];
        document.getElementById('level').innerText = level;
    }

    function endGame(msg) {
        gameActive = false;
        document.getElementById('msg').style.display = "block";
        document.getElementById('title').innerText = msg;
    }

    function resetGame() {
        location.reload();
    }

    draw();
</script>
</body>
</html>
