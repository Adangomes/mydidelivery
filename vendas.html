<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI | Analytics Dinâmico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CONFIGURAÇÕES DE DESIGN (UI) */
        :root {
            --bg: #0a0b1e;
            --card-bg: #161b33;
            --primary: #7000ff;
            --accent: #00f2ff;
            --loss: #ff4d4d; /* Cor para Perdas */
            --gain: #2ecc71; /* Cor para Ganhos */
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* ESTILO DOS CARDS */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* CONTROLES DE FILTRO */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-filter.active, .btn-filter:hover {
            background: var(--accent);
            color: var(--bg);
        }

        /* ÁREA DE INPUT DE VALORES */
        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        input {
            background: #0d1127;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
        }

        label { display: block; font-size: 12px; margin-bottom: 5px; color: #a0a0c0; }
    </style>
</head>
<body>

<main>
    <h1>Gestão Financeira <span style="color: var(--accent);">Nexus AI</span></h1>

    <div class="filter-bar">
        <button class="btn-filter" onclick="mudarPeriodo('dia')">Dia</button>
        <button class="btn-filter active" onclick="mudarPeriodo('semana')">Semana</button>
        <button class="btn-filter" onclick="mudarPeriodo('mes')">Mês</button>
        <button class="btn-filter" onclick="mudarPeriodo('ano')">Ano</button>
    </div>

    <div class="card">
        <h3>Lançamento Manual de Dados</h3>
        <div class="input-group">
            <div>
                <label>Vendas (R$)</label>
                <input type="number" id="in-vendas" placeholder="Ex: 5000">
            </div>
            <div>
                <label>Perdas (R$)</label>
                <input type="number" id="in-perdas" placeholder="Ex: 200">
            </div>
            <button onclick="aplicarValores()" style="background: var(--primary); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; height: 40px; margin-top: 22px;">
                Aplicar no Gráfico
            </button>
        </div>
    </div>

    <div class="card">
        <h3>Análise Comparativa: <span id="labelPeriodo">Semanal</span></h3>
        <div style="height: 350px;">
            <canvas id="meuGrafico"></canvas>
        </div>
    </div>
</main>

<script>
    // DATASETS (Dados de exemplo para cada período)
    const dados = {
        dia: { labels: ['08h', '12h', '16h', '20h'], vendas: [100, 500, 300, 800], perdas: [10, 50, 20, 40] },
        semana: { labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab', 'Dom'], vendas: [1200, 1900, 1500, 2500, 2200, 3000, 2800], perdas: [200, 400, 150, 300, 500, 100, 200] },
        mes: { labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'], vendas: [15000, 22000, 18000, 25000], perdas: [2000, 1500, 3000, 1000] },
        ano: { labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'], vendas: [80000, 95000, 110000, 85000, 120000, 150000], perdas: [15000, 10000, 20000, 5000, 12000, 18000] }
    };

    const ctx = document.getElementById('meuGrafico').getContext('2d');
    
    // INICIALIZAÇÃO DO GRÁFICO (Aqui o gráfico nasce)
    let dashboardChart = new Chart(ctx, {
        type: 'bar', // Tipo barra para comparar ganhos e perdas lado a lado
        data: {
            labels: dados.semana.labels,
            datasets: [
                {
                    label: 'Ganhos/Vendas',
                    data: dados.semana.vendas,
                    backgroundColor: '#2ecc71',
                    borderRadius: 5
                },
                {
                    label: 'Perdas',
                    data: dados.semana.perdas,
                    backgroundColor: '#ff4d4d',
                    borderRadius: 5
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#aaa' } },
                x: { ticks: { color: '#aaa' } }
            }
        }
    });

    // FUNÇÃO PARA MUDAR O PERÍODO (Lógica de troca de dados)
    function mudarPeriodo(periodo) {
        // 1. Atualiza os textos na tela
        document.getElementById('labelPeriodo').innerText = periodo.charAt(0).toUpperCase() + periodo.slice(1);
        
        // 2. Troca os dados do objeto Chart
        dashboardChart.data.labels = dados[periodo].labels;
        dashboardChart.data.datasets[0].data = dados[periodo].vendas;
        dashboardChart.data.datasets[1].data = dados[periodo].perdas;
        
        // 3. Redesenha o gráfico com animação
        dashboardChart.update();

        // Estilo dos botões
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }

    // FUNÇÃO PARA APLICAR VALORES DOS INPUTS (A parte "viva" do sistema)
    function aplicarValores() {
        const v = parseFloat(document.getElementById('in-vendas').value);
        const p = parseFloat(document.getElementById('in-perdas').value);

        if(!isNaN(v) && !isNaN(p)) {
            // Adiciona o novo valor ao final do dataset atual
            dashboardChart.data.datasets[0].data.push(v);
            dashboardChart.data.datasets[1].data.push(p);
            dashboardChart.data.labels.push('Novo');
            
            dashboardChart.update();
            alert('Dados inseridos no banco (Simulado)');
        } else {
            alert('Por favor, preencha os valores corretamente.');
        }
    }
</script>
</body>
</html>
