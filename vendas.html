<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYDI DELIVERY | Dashboard Inteligente</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#0b0f1a;
    --card:#141a2e;
    --primary:#6c5ce7;
    --accent:#00e5ff;
    --green:#2ecc71;
    --red:#ff4d4d;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:white;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:15px;
}

.kpi{
    text-align:center;
}

.kpi h2{
    margin:0;
}

input,button{
    padding:10px;
    border:none;
    border-radius:8px;
}

input{
    background:#0e1424;
    color:white;
}

button{
    background:linear-gradient(45deg,var(--primary),var(--accent));
    color:white;
    cursor:pointer;
}

.table{
    width:100%;
    margin-top:10px;
}

.table td{
    padding:8px;
    border-bottom:1px solid #222;
}

</style>
</head>

<body>

<div class="container">

<h1>📊 MYDI DELIVERY</h1>

<!-- KPIs -->
<div class="grid">
    <div class="card kpi">
        <h2 id="receita">R$0</h2>
        <small>Receita</small>
    </div>

    <div class="card kpi">
        <h2 id="custos">R$0</h2>
        <small>Custos</small>
    </div>

    <div class="card kpi">
        <h2 id="lucro">R$0</h2>
        <small>Lucro</small>
    </div>

    <div class="card kpi">
        <h2 id="margem">0%</h2>
        <small>Margem</small>
    </div>
</div>

<!-- Lançamentos -->
<div class="card">
<h3>Novo Pedido</h3>

<div class="grid">
<input type="date" id="data">
<input type="number" id="valor" placeholder="Valor venda">
<input type="number" id="custo" placeholder="Custo">
<button onclick="add()">Adicionar</button>
</div>
</div>

<!-- Gráfico -->
<div class="card">
<canvas id="grafico"></canvas>
</div>

<!-- Tabela -->
<div class="card">
<h3>Relatório</h3>
<table class="table" id="tabela"></table>
</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem('mydi')) || [];

function add(){
    let data = document.getElementById('data').value;
    let valor = +document.getElementById('valor').value;
    let custo = +document.getElementById('custo').value;

    if(!data) return alert("Data obrigatória");

    db.push({data,valor,custo});
    localStorage.setItem('mydi',JSON.stringify(db));

    render();
}

function calc(){

    let receita = db.reduce((a,b)=>a+b.valor,0);
    let custos = db.reduce((a,b)=>a+b.custo,0);
    let lucro = receita - custos;
    let margem = receita ? ((lucro/receita)*100).toFixed(1):0;

    document.getElementById('receita').innerText = "R$"+receita;
    document.getElementById('custos').innerText = "R$"+custos;
    document.getElementById('lucro').innerText = "R$"+lucro;
    document.getElementById('margem').innerText = margem+"%";
}

let chart;

function renderChart(){

    let dias = db.map(i=>i.data);
    let valores = db.map(i=>i.valor);

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById('grafico'),{
        type:'line',
        data:{
            labels:dias,
            datasets:[{
                label:"Vendas",
                data:valores
            }]
        }
    });
}

function renderTable(){

    let html = "<tr><td>Data</td><td>Venda</td><td>Custo</td><td>Lucro</td></tr>";

    db.forEach(i=>{
        html+=`
        <tr>
        <td>${i.data}</td>
        <td>${i.valor}</td>
        <td>${i.custo}</td>
        <td>${i.valor - i.custo}</td>
        </tr>`;
    });

    document.getElementById('tabela').innerHTML = html;
}

function render(){
    calc();
    renderChart();
    renderTable();
}

render();

</script>

</body>
</html>
