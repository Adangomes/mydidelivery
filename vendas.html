<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI | Enterprise Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #7000ff;
            --accent: #00f2ff;
            --bg: #0a0b1e;
            --card-bg: #161b33;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, #1a1b3a 0%, #0a0b1e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVEGAÇÃO ADAPTATIVA --- */
        nav {
            width: 280px;
            height: 100vh;
            background: rgba(22, 27, 51, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            position: fixed;
            z-index: 100;
            transition: 0.4s;
        }

        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 3rem; display: flex; align-items: center; gap: 10px; }

        .nav-link {
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.3s;
            color: #a0a0c0;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(112, 0, 255, 0.3);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        main { 
            margin-left: 280px; 
            padding: 2.5rem; 
            width: calc(100% - 280px);
            transition: 0.4s; 
        }

        .header-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 2.5rem; 
            flex-wrap: wrap;
            gap: 20px;
        }

        /* --- GRIDS RESPONSIVOS --- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { transform: translateY(-8px); border-color: var(--accent); }

        .value { font-size: 2.2rem; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }

        .charts-section { 
            display: grid; 
            grid-template-columns: 1.8fr 1.2fr; 
            gap: 25px; 
        }

        /* --- MODAL ADAPTADO --- */
        .modal {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px; 
            padding: 30px; 
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        /* --- MEDIA QUERIES (A MÁGICA DO MOBILE) --- */
        @media (max-width: 1024px) {
            nav { width: 80px; padding: 2rem 1rem; text-align: center; }
            nav .logo span, nav .nav-link span { display: none; }
            nav .nav-link { justify-content: center; padding: 15px; }
            main { margin-left: 80px; width: calc(100% - 80px); padding: 1.5rem; }
            .charts-section { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            nav {
                width: 100%;
                height: 70px;
                bottom: 0;
                top: auto;
                left: 0;
                border-right: none;
                border-top: 1px solid var(--glass-border);
                padding: 0 10px;
                display: flex;
                justify-content: space-around;
                align-items: center;
                border-radius: 20px 20px 0 0;
            }
            .logo { display: none; }
            .nav-link { margin: 0; flex-direction: column; gap: 5px; font-size: 10px; }
            .nav-link i { font-size: 1.4rem; }
            
            main { 
                margin-left: 0; 
                width: 100%; 
                padding: 1rem;
                padding-bottom: 100px; /* Espaço para a nav inferior */
            }
            .header-actions h1 { font-size: 1.5rem; }
            .btn-premium { width: 100%; text-align: center; }
        }

        button.btn-premium {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none; padding: 14px 28px; color: white; border-radius: 14px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fas fa-bolt"></i> <span>NEXUS AI</span></div>
        <div class="nav-link active"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
        <div class="nav-link"><i class="fas fa-wallet"></i> <span>Vendas</span></div>
        <div class="nav-link" onclick="openModal()"><i class="fas fa-plus-circle"></i> <span>Novo</span></div>
    </nav>

    <main>
        <div class="header-actions">
            <h1>Analytics <span style="font-weight: 300; color: var(--accent);">Live</span></h1>
            <button class="btn-premium" onclick="updateData()">
                <i class="fas fa-sync-alt"></i> Sincronizar
            </button>
        </div>

        <div class="kpi-grid">
            <div class="card">
                <i class="fas fa-coins" style="color: #f1c40f"></i>
                <h3>Faturamento</h3>
                <div class="value" id="val-rev">R$ 842.150</div>
                <small style="color: #2ecc71"><i class="fas fa-arrow-up"></i> +24% este mês</small>
            </div>
            <div class="card">
                <i class="fas fa-users" style="color: var(--accent)"></i>
                <h3>Novos Leads</h3>
                <div class="value">1.402</div>
                <small style="color: #a0a0c0">Taxa de retenção: 94%</small>
            </div>
        </div>

        <div class="charts-section">
            <div class="card">
                <h3>Escalabilidade Diária</h3>
                <div style="height: 300px; position: relative;">
                    <canvas id="chartMain"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>Origem de Tráfego</h3>
                <div style="height: 300px; position: relative;">
                    <canvas id="chartDoughnut"></canvas>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 200;">
        <div class="modal" id="mainModal">
            <h2 style="margin-bottom: 10px;">Gerar Relatório Inteligente</h2>
            <p style="color: #a0a0c0; margin-bottom: 25px;">O sistema processará os dados dos últimos 30 dias usando modelos preditivos.</p>
            <button class="btn-premium" style="width: 100%;">Confirmar e Processar</button>
            <button onclick="closeModal()" style="width: 100%; background: transparent; color: white; border: none; margin-top: 15px; cursor: pointer;">Voltar</button>
        </div>
    </div>

    <script>
        // Configuração Responsiva do Chart.js
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#666' } },
                x: { grid: { display: false }, ticks: { color: '#666' } }
            }
        };

        const chartCtx = document.getElementById('chartMain').getContext('2d');
        let mainChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: ['01', '02', '03', '04', '05', '06', '07'],
                datasets: [{
                    data: [30, 55, 40, 85, 70, 110, 95],
                    borderColor: '#7000ff',
                    backgroundColor: 'rgba(112, 0, 255, 0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3
                }]
            },
            options: chartOptions
        });

        const doughnutCtx = document.getElementById('chartDoughnut').getContext('2d');
        new Chart(doughnutCtx, {
            type: 'doughnut',
            data: {
                labels: ['Direto', 'Social', 'Ads'],
                datasets: [{
                    data: [45, 30, 25],
                    backgroundColor: ['#7000ff', '#00f2ff', '#161b33'],
                    borderWidth: 0
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: '#aaa', usePointStyle: true } } }
            }
        });

        function updateData() {
            const btn = document.querySelector('.btn-premium');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Aguarde...';
            
            setTimeout(() => {
                document.getElementById('val-rev').innerText = 'R$ ' + Math.floor(Math.random() * 900000).toLocaleString('pt-BR');
                mainChart.data.datasets[0].data = mainChart.data.datasets[0].data.map(() => Math.floor(Math.random() * 100));
                mainChart.update();
                btn.innerHTML = originalText;
            }, 1200);
        }

        function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    </script>
</body>
</html>
