<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI | Inteligência de Dados Real</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0b1e;
            --card-bg: #161b33;
            --primary: #7000ff;
            --accent: #00f2ff;
            --gain: #2ecc71;
            --loss: #ff4d4d;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        input, select {
            background: #0d1127;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
        }

        .btn-main {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none; color: white; padding: 12px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
            transition: 0.3s;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box { text-align: center; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px; }
        
        .filter-btn {
            padding: 8px 18px; border-radius: 20px; border: 1px solid var(--accent);
            background: transparent; color: white; cursor: pointer; margin-right: 5px;
        }
        .filter-btn.active { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Fluxo <span style="color: var(--accent);">Automático</span></h1>

    <div class="card">
        <h3><i class="fas fa-plus-circle"></i> Novo Lançamento Diário</h3>
        <div class="grid-inputs">
            <div>
                <label>Data da Venda</label>
                <input type="date" id="data-venda">
            </div>
            <div>
                <label>Venda Bruta (R$)</label>
                <input type="number" id="valor-venda" placeholder="0,00">
            </div>
            <div>
                <label>Perdas/Gastos (R$)</label>
                <input type="number" id="valor-perda" placeholder="0,00">
            </div>
            <button class="btn-main" onclick="salvarDados()" style="margin-top: 22px;">Salvar no Histórico</button>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h3><i class="fas fa-chart-bar"></i> Visão Geral</h3>
            <div>
                <button class="filter-btn" onclick="renderizar('dia')">Por Dia</button>
                <button class="filter-btn active" onclick="renderizar('mes')">Por Mês</button>
            </div>
        </div>

        <div style="height: 350px; margin-top: 20px;">
            <canvas id="chartAnalitico"></canvas>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <small>Mês mais Alto</small>
                <div id="mes-alto" style="color: var(--gain); font-weight: bold;">--</div>
            </div>
            <div class="stat-box">
                <small>Melhor Dia de Venda</small>
                <div id="dia-recorde" style="color: var(--accent); font-weight: bold;">--</div>
            </div>
            <div class="stat-box">
                <small>Total Perdas Ano</small>
                <div id="total-perdas" style="color: var(--loss); font-weight: bold;">R$ 0</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. BANCO DE DADOS LOCAL (Simulando o que ficaria salvo)
    // Aqui os dados não se multiplicam, eles ficam guardados por data real.
    let dbVendas = JSON.parse(localStorage.getItem('nexus_db')) || [];

    const ctx = document.getElementById('chartAnalitico').getContext('2d');
    let meuGrafico;

    // 2. FUNÇÃO PARA SALVAR (O coração do sistema)
    function salvarDados() {
        const data = document.getElementById('data-venda').value;
        const venda = parseFloat(document.getElementById('valor-venda').value) || 0;
        const perda = parseFloat(document.getElementById('valor-perda').value) || 0;

        if (!data) return alert("Selecione uma data!");

        // Adiciona ao "banco de dados"
        dbVendas.push({ data, venda, perda });
        
        // Salva no navegador para não perder ao dar F5
        localStorage.setItem('nexus_db', JSON.stringify(dbVendas));

        // Limpa campos e atualiza visual
        document.getElementById('valor-venda').value = '';
        document.getElementById('valor-perda').value = '';
        
        alert("Lançamento efetuado!");
        renderizar('mes'); // Atualiza o gráfico automaticamente
    }

    // 3. LÓGICA DE PROCESSAMENTO (Transforma lista de vendas em dados de gráfico)
    function processarDados(tipo) {
        let labels = [];
        let vendasData = [];
        let perdasData = [];

        if (tipo === 'mes') {
            // Agrupa por mês (Jan, Fev...) para o ano inteiro
            const mesesBr = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            labels = mesesBr;
            vendasData = new Array(12).fill(0);
            perdasData = new Array(12).fill(0);

            dbVendas.forEach(item => {
                const mesIdx = new Date(item.data).getUTCMonth();
                vendasData[mesIdx] += item.venda; // SOMA apenas no mês certo
                perdasData[mesIdx] += item.perda;
            });
        } else {
            // Visão por Dia (mostra os últimos lançamentos reais)
            dbVendas.sort((a,b) => new Date(a.data) - new Date(b.data));
            labels = dbVendas.map(i => i.data.split('-').reverse().slice(0,2).join('/'));
            vendasData = dbVendas.map(i => i.venda);
            perdasData = dbVendas.map(i => i.perda);
        }

        return { labels, vendasData, perdasData };
    }

    // 4. RENDERIZAÇÃO DO GRÁFICO
    function renderizar(modo) {
        const info = processarDados(modo);

        if (meuGrafico) meuGrafico.destroy(); // Limpa o gráfico anterior

        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: info.labels,
                datasets: [
                    { label: 'Vendas Brutas', data: info.vendasData, backgroundColor: '#2ecc71' },
                    { label: 'Perdas/Custos', data: info.perdasData, backgroundColor: '#ff4d4d' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#1a1b3a' } }
                }
            }
        });

        calcularInsights();
    }

    // 5. CÁLCULOS AUTOMÁTICOS (Dia que vendeu mais, etc)
    function calcularInsights() {
        if (dbVendas.length === 0) return;

        // Dia Recorde
        const recorde = [...dbVendas].sort((a,b) => b.venda - a.venda)[0];
        document.getElementById('dia-recorde').innerText = recorde.data.split('-').reverse().join('/') + ` (R$ ${recorde.venda})`;

        // Total Perdas
        const totalP = dbVendas.reduce((acc, cur) => acc + cur.perda, 0);
        document.getElementById('total-perdas').innerText = `R$ ${totalP.toLocaleString('pt-BR')}`;

        // Mês mais alto (lógica simples de busca)
        const infoMes = processarDados('mes');
        const maxVenda = Math.max(...infoMes.vendasData);
        const mesIdx = infoMes.vendasData.indexOf(maxVenda);
        document.getElementById('mes-alto').innerText = infoMes.labels[mesIdx] + ` (R$ ${maxVenda})`;
    }

    // Iniciar sistema
    renderizar('mes');
</script>
</body>
</html>
